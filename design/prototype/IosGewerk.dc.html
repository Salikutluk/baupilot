<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot iOS – Gewerk Estrich</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, -apple-system, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 50px 20px 110px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 44px">
      <a href="IosHome.dc.html" style="display: flex; align-items: center; gap: 2px; color: {{t.accent}}; text-decoration: none; font-size: 17px; min-height: 44px; margin-left: -6px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
        Übersicht
      </a>
      <button type="button" aria-label="Weitere Aktionen" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.accent}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.6px">Estrich</h1>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <span style="font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 8px; background: {{t.aSoft}}; color: {{t.aFg}}">Angebote einholen</span>
        <span style="font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 8px; background: {{t.chip}}; color: {{t.muted}}">Phase 8 · Estrich</span>
      </div>
    </div>

    <div style="background: {{t.surface}}; border-radius: 16px; padding: 14px 4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 12px">
        <span style="font-size: 12px; font-weight: 600; color: {{t.muted}}">Zeitfenster</span>
        <span style="font-size: 15px; font-weight: 600">KW 8–9</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 12px; border-left: 1px solid {{t.border}}">
        <span style="font-size: 12px; font-weight: 600; color: {{t.muted}}">Angebotsfrist</span>
        <span style="font-size: 15px; font-weight: 600">15.01.2027</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 12px; border-left: 1px solid {{t.border}}">
        <span style="font-size: 12px; font-weight: 600; color: {{t.muted}}">Wartet auf</span>
        <span style="font-size: 15px; font-weight: 600">Installateur</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 20px; font-weight: 700">Angebote</h2>
        <span style="font-size: 14px; color: {{t.muted}}">2 von 3 erhalten</span>
      </div>
      <div style="background: {{t.surface}}; border-radius: 16px; overflow: hidden">
        <sc-for list="{{offers}}" as="o" hint-placeholder-count="3">
          <a href="{{o.href}}" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-decoration: none; color: {{t.text}}; border-top: {{o.divider}}">
            <div style="width: 38px; height: 38px; border-radius: 10px; background: {{t.chip}}; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6"></path></svg>
            </div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span style="font-size: 15px; font-weight: 600">{{o.firm}}</span>
              <span style="font-size: 13px; color: {{t.muted}}">{{o.meta}}</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
              <span style="font-size: 15px; font-weight: 700; color: {{o.priceColor}}">{{o.price}}</span>
              <sc-if value="{{o.best}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: {{t.oSoft}}; color: {{t.oFg}}">Günstigstes</span>
              </sc-if>
            </div>
          </a>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700">Nächste Schritte</h2>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; border: 2px solid {{s.ring}}; background: {{s.fill}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
              <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{s.tick}}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
            </span>
            <span style="font-size: 15px; color: {{s.color}}">{{s.label}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 20px 34px; background: {{t.bar}}; border-top: 1px solid {{t.border}}; display: flex; gap: 10px">
    <a href="IosVergleich.dc.html" style="flex: 1; height: 50px; border-radius: 14px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; text-decoration: none">Angebote vergleichen</a>
    <button type="button" aria-label="Dokument hinzufügen" style="width: 50px; height: 50px; border-radius: 14px; border: 0; background: {{t.chip}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#121417', surface: '#1C1F23', text: '#F2F2F0', muted: '#A3A8AE', border: '#2A2E33', accent: '#FB923C', onAccent: '#1A0E05', chip: '#262A2F', bar: '#17191CF2', aSoft: '#3A2414', aFg: '#FDBA74', oSoft: '#16301F', oFg: '#86EFAC', ok: '#4ADE80', okInk: '#0B1F12' }
      : { bg: '#F5F4F1', surface: '#FFFFFF', text: '#17191C', muted: '#5C6168', border: '#E2E0DB', accent: '#C2410C', onAccent: '#FFFFFF', chip: '#F0EEEA', bar: '#FFFFFFF2', aSoft: '#FDEBDD', aFg: '#9A3412', oSoft: '#E3F4E8', oFg: '#166534', ok: '#15803D', okInk: '#FFFFFF' };
    const line = '1px solid ' + t.border;
    const offers = [
      { firm: 'Estrichbau Wagner', meta: 'PDF · eingegangen 10.12.', price: '9.800 €', best: true },
      { firm: 'Fließestrich Hahn', meta: 'PDF · eingegangen 14.12.', price: '10.450 €', best: false },
      { firm: 'Bodenbau Lorenz', meta: 'Angefragt am 05.12.', price: 'Ausstehend', best: false, pending: true }
    ].map((o, i) => ({ ...o, divider: i ? line : '0', priceColor: o.pending ? t.muted : t.text, href: o.pending ? '#' : 'IosDokViewer.dc.html' }));
    const step = (label, done) => ({ label, ring: done ? t.ok : t.muted, fill: done ? t.ok : 'transparent', tick: done ? t.okInk : 'transparent', color: done ? t.muted : t.text });
    return {
      t,
      offers,
      steps: [
        step('Anfrage an 3 Betriebe gesendet', true),
        step('Angebote vergleichen', false),
        step('Auftrag vergeben, Termin fixieren', false)
      ]
    };
  }
}
</script>
</body>
</html>
