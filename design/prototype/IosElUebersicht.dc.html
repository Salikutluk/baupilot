<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot iOS – Abnahme Elektro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, -apple-system, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 50px 20px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; height: 44px">
      <a href="IosAbnGewerke.dc.html" style="display: flex; align-items: center; gap: 2px; color: {{t.accent}}; text-decoration: none; font-size: 17px; min-height: 44px; margin-left: -6px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
        Abnahmen
      </a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.6px">Elektro</h1>
      <span style="font-size: 14px; color: {{t.muted}}">Elektro Schmitt GmbH · Mo, 26.04.2027</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="background: {{t.surface}}; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; font-weight: 600; color: {{t.muted}}">1 · Rohinstallation</span>
        <span style="font-size: 15px; font-weight: 600; color: {{t.oFg}}">Abgenommen</span>
        <span style="font-size: 12px; color: {{t.muted}}">am 29.01.2027</span>
      </div>
      <div style="background: {{t.surface}}; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; border: 2px solid {{t.accent}}">
        <span style="font-size: 12px; font-weight: 600; color: {{t.muted}}">2 · Fertiginstallation</span>
        <span style="font-size: 15px; font-weight: 600">4 von 11 geprüft</span>
        <span style="height: 4px; border-radius: 2px; background: {{t.track}}; display: block"><span style="display: block; width: 36%; height: 4px; border-radius: 2px; background: {{t.accent}}"></span></span>
      </div>
    </div>

    <sc-for list="{{groups}}" as="grp" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 0 4px">
          <h2 style="margin: 0; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: {{t.muted}}">{{grp.title}}</h2>
          <a href="#" style="font-size: 13px; font-weight: 600; color: {{t.accent}}; text-decoration: none; min-height: 44px; margin: -14px 0; display: flex; align-items: center">{{grp.more}}</a>
        </div>
        <div style="background: {{t.surface}}; border-radius: 14px; overflow: hidden">
          <sc-for list="{{grp.rows}}" as="r" hint-placeholder-count="3">
            <a href="{{r.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; text-decoration: none; color: {{t.text}}; border-top: {{r.divider}}">
              <span style="width: 34px; height: 34px; border-radius: 9px; background: {{t.chip}}; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg>
              </span>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
                <span style="font-size: 15px; font-weight: 600">{{r.name}}</span>
                <span style="font-size: 13px; color: {{t.muted}}">{{r.sub}}</span>
              </div>
              <span style="font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 7px; background: {{r.bg}}; color: {{r.fg}}; white-space: nowrap">{{r.status}}</span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#121417', surface: '#1C1F23', text: '#F2F2F0', muted: '#A3A8AE', border: '#2A2E33', accent: '#FB923C', chip: '#262A2F', track: '#3A3F45', aSoft: '#3A2414', aFg: '#FDBA74', oSoft: '#16301F', oFg: '#86EFAC', eSoft: '#3B1717', eFg: '#FCA5A5' }
      : { bg: '#F5F4F1', surface: '#FFFFFF', text: '#17191C', muted: '#5C6168', border: '#E2E0DB', accent: '#C2410C', chip: '#F0EEEA', track: '#E4E1DB', aSoft: '#FDEBDD', aFg: '#9A3412', oSoft: '#E3F4E8', oFg: '#166534', eSoft: '#FDE7E7', eFg: '#991B1B' };
    const line = '1px solid ' + t.border;
    const S = { ok: ['In Ordnung', t.oSoft, t.oFg], run: ['Läuft', t.aSoft, t.aFg], open: ['Offen', t.chip, t.muted], miss: ['Fehlt', t.eSoft, t.eFg], have: ['Vorhanden', t.oSoft, t.oFg] };
    const rows = (rs) => rs.map(([name, sub, k, icon, href], i) => ({ name, sub, icon, href: href || '#', status: S[k][0], bg: S[k][1], fg: S[k][2], divider: i ? line : '0' }));
    const room = 'M3 11l9-7 9 7M5 10v10h14V10';
    const doc = 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6';
    return {
      t,
      groups: [
        { title: 'Haustechnik', more: '', rows: rows([
          ['Zählerschrank & FI-Test', '5 Prüfschritte', 'open', 'M5 3h14v18H5zM9 7h6M9 11h6M12 15v3', 'IosElVerteiler.dc.html'],
          ['Rauchwarnmelder', '3 von 5 getestet', 'run', 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 8v4M12 16h.01', 'IosElRauchmelder.dc.html']
        ]) },
        { title: 'Räume', more: 'Alle 9', rows: rows([
          ['Küche', 'EG · Schritt 2 von 5', 'run', room, 'IosElRaum.dc.html'],
          ['Wohnen / Essen', 'EG · 14 Steckdosen, 4 Licht', 'ok', room],
          ['Bad', 'OG · 4 Steckdosen, 3 Auslässe', 'open', room]
        ]) },
        { title: 'Dokumente vom Elektriker', more: '', rows: rows([
          ['Prüfprotokoll VDE 0100-600', 'Pflicht vor Abnahme · anfordern', 'miss', doc],
          ['Verteilerplan & Stromkreisliste', 'PDF · 20.04.2027', 'have', doc]
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
