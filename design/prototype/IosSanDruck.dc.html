<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot iOS – Druckprobe Trinkwasser</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, -apple-system, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 50px 20px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 44px">
      <a href="IosSanUebersicht.dc.html" style="display: flex; align-items: center; gap: 2px; color: {{t.accent}}; text-decoration: none; font-size: 17px; min-height: 44px; margin-left: -6px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
        Sanitär
      </a>
      <span style="font-size: 15px; font-weight: 600; color: {{t.muted}}">Schritt 3 von 5</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Druckprobe Trinkwasser</h1>
      <span style="font-size: 14px; color: {{t.muted}}">Gemeinsam mit dem Installateur · vor dem Verschließen</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{done}}" as="s" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px; border-radius: 12px; background: {{t.surface}}">
          <span style="width: 22px; height: 22px; border-radius: 11px; background: {{t.ok}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.okInk}}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
          </span>
          <span style="flex: 1; font-size: 15px; color: {{t.muted}}">{{s.label}}</span>
          <span style="font-size: 13px; font-weight: 600; color: {{t.text}}">{{s.meta}}</span>
        </div>
      </sc-for>
    </div>

    <div style="border-radius: 16px; background: {{t.surface}}; border: 2px solid {{t.accent}}; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 26px; height: 26px; border-radius: 13px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0">3</span>
        <h2 style="margin: 0; font-size: 19px; font-weight: 700">Manometer am Ende ablesen</h2>
      </div>
      <div style="display: flex; align-items: center; gap: 14px">
        <div style="width: 72px; height: 72px; border-radius: 36px; background: conic-gradient({{t.accent}} 0 58%, {{t.track}} 58% 100%); display: flex; align-items: center; justify-content: center; flex-shrink: 0" role="img" aria-label="Prüfzeit zu 58 Prozent abgelaufen">
          <span style="width: 56px; height: 56px; border-radius: 28px; background: {{t.surface}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">12:40</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">Noch 12:40 Min. Prüfzeit</span>
          <span style="font-size: 13px; line-height: 1.4; color: {{t.muted}}">Prüfdruck und Dauer legt der Installateur fest.</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; font-weight: 600; color: {{t.muted}}">Start (10:02)</span>
          <span style="height: 48px; box-sizing: border-box; border-radius: 12px; background: {{t.chip}}; display: flex; align-items: center; padding: 0 14px; font-size: 16px; font-weight: 700">10,0 bar</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="druck-ende" style="font-size: 12px; font-weight: 600; color: {{t.muted}}">Ende</label>
          <input id="druck-ende" type="text" placeholder="– bar" style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1.5px solid {{t.accent}}; background: transparent; color: {{t.text}}; padding: 0 14px; font: inherit; font-size: 16px; font-weight: 700">
        </div>
      </div>
      <button type="button" style="height: 50px; border-radius: 14px; border: 1.5px dashed {{t.accent}}; background: transparent; color: {{t.accent}}; display: flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-size: 15px; font-weight: 600">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        Manometer fotografieren
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{next}}" as="s" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px">
          <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; border: 2px solid {{t.track}}; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: {{t.muted}}; flex-shrink: 0">{{s.n}}</span>
          <span style="flex: 1; font-size: 15px">{{s.label}}</span>
          <span style="font-size: 12px; font-weight: 600; color: {{s.tagColor}}">{{s.tag}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#121417', surface: '#1C1F23', text: '#F2F2F0', muted: '#A3A8AE', accent: '#FB923C', onAccent: '#1A0E05', chip: '#262A2F', track: '#3A3F45', ok: '#4ADE80', okInk: '#0B1F12', eFg: '#FCA5A5' }
      : { bg: '#F5F4F1', surface: '#FFFFFF', text: '#17191C', muted: '#5C6168', accent: '#C2410C', onAccent: '#FFFFFF', chip: '#F0EEEA', track: '#E4E1DB', ok: '#15803D', okInk: '#FFFFFF', eFg: '#991B1B' };
    return {
      t,
      done: [
        { label: 'Leitungen sichtbar & beschriftet', meta: '3 Fotos' },
        { label: 'Manometer zu Beginn', meta: '10,0 bar' }
      ],
      next: [
        { n: '4', label: 'Alle Verbindungen trocken', tag: '', tagColor: t.muted },
        { n: '5', label: 'Druckprüfprotokoll unterschrieben', tag: 'Pflicht', tagColor: t.eFg }
      ]
    };
  }
}
</script>
</body>
</html>
