<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot Android – Prüfschritt Fenster F8</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9C4300}a:hover{color:#753400}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <header style="height: 64px; margin-top: 32px; padding: 0 16px 0 4px; display: flex; align-items: center; gap: 4px">
    <a href="AndAbnElemente.dc.html" aria-label="Schließen" style="width: 48px; height: 48px; border-radius: 24px; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-size: 20px">F8 · Schlafen</span>
      <span style="font-size: 13px; color: {{t.muted}}">OG · Dreh-Kipp-Fenster, 1-flügelig</span>
    </div>
    <span style="font-size: 14px; font-weight: 500; color: {{t.muted}}">3 / 6</span>
  </header>
  <div style="height: 4px; margin: 0 16px; border-radius: 2px; background: {{t.track}}">
    <div style="width: 42%; height: 4px; border-radius: 2px; background: {{t.primary}}"></div>
  </div>

  <div style="padding: 16px 16px 0; display: flex; flex-direction: column">
    <sc-for list="{{done}}" as="s" hint-placeholder-count="2">
      <div style="display: flex; gap: 16px; min-height: 52px">
        <div style="display: flex; flex-direction: column; align-items: center; width: 24px">
          <span style="width: 24px; height: 24px; border-radius: 12px; background: {{t.primary}}; color: {{t.onPrimary}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
          </span>
          <span style="flex: 1; width: 1px; background: {{t.outlineVariant}}"></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 2px">
          <span style="font-size: 15px">{{s.label}}</span>
          <span style="font-size: 13px; color: {{t.muted}}">{{s.meta}}</span>
        </div>
      </div>
    </sc-for>

    <div style="display: flex; gap: 16px">
      <div style="display: flex; flex-direction: column; align-items: center; width: 24px">
        <span style="width: 24px; height: 24px; border-radius: 12px; background: {{t.primary}}; color: {{t.onPrimary}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; flex-shrink: 0">3</span>
        <span style="flex: 1; width: 1px; background: {{t.outlineVariant}}"></span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px">
        <h2 style="margin: 2px 0 0; font-size: 18px; font-weight: 500">Sitzt das Fenster im Wasser?</h2>
        <p style="margin: 0; font-size: 14px; line-height: 20px; color: {{t.muted}}">Wasserwaage oben und seitlich an den Rahmen halten – die Blase muss jeweils mittig stehen.</p>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <div style="height: 80px; border-radius: 12px; background: {{t.surfaceContainerHigh}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.muted}}; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="56" height="44" viewBox="0 0 56 44"><rect x="8" y="12" width="32" height="30" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"></rect><line x1="24" y1="12" x2="24" y2="42" stroke="currentColor" stroke-width="1.5"></line><rect x="6" y="3" width="36" height="6" rx="2" fill="{{t.primary}}"></rect><circle cx="24" cy="6" r="2" fill="{{t.surfaceContainerHigh}}"></circle><rect x="45" y="12" width="6" height="30" rx="2" fill="{{t.primary}}"></rect><circle cx="48" cy="27" r="2" fill="{{t.surfaceContainerHigh}}"></circle></svg>So prüfen</div>
          <div style="height: 80px; border-radius: 12px; position: relative; overflow: hidden; background: linear-gradient(160deg, #A9B7C0 0%, #6F8090 60%, #56626C 100%)"><svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 100 80" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0"><rect x="22" y="10" width="56" height="62" fill="none" stroke="#F4F6F7" stroke-width="5"></rect><line x1="50" y1="10" x2="50" y2="72" stroke="#F4F6F7" stroke-width="3"></line><rect x="18" y="4" width="64" height="7" rx="2" fill="#E8B23A"></rect></svg><span style="position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 10px; background: #15803D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span><span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 6px; background: rgba(0,0,0,0.45); color: #FFFFFF; font-size: 11px; font-weight: 600">Foto oben</span></div>
          <button type="button" style="height: 80px; border-radius: 12px; border: 1px solid {{t.outline}}; background: transparent; color: {{t.primary}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: inherit; font-size: 12px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Foto seitlich</button>
        </div>
        <div style="display: flex; gap: 8px">
          <a href="AndAbnMangel.dc.html" style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid {{t.outline}}; color: {{t.err}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500; text-decoration: none">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
            Mangel
          </a>
          <button type="button" style="flex: 1; height: 48px; border-radius: 24px; border: 0; background: {{t.primary}}; color: {{t.onPrimary}}; display: flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-size: 15px; font-weight: 500">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
            In Ordnung
          </button>
        </div>
      </div>
    </div>

    <sc-for list="{{next}}" as="s" hint-placeholder-count="3">
      <div style="display: flex; gap: 16px; min-height: 48px">
        <div style="display: flex; flex-direction: column; align-items: center; width: 24px">
          <span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{t.outline}}; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; flex-shrink: 0">{{s.n}}</span>
          <span style="flex: 1; width: 1px; background: {{s.line}}"></span>
        </div>
        <span style="font-size: 15px; color: {{t.muted}}; padding-top: 2px">{{s.label}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#16130F', text: '#ECE0D8', muted: '#D7C3B8', outline: '#A08D83', outlineVariant: '#52443C', primary: '#FFB68E', onPrimary: '#532200', track: '#3E3630', surfaceContainerHigh: '#2E2925', err: '#FFB4AB' }
      : { bg: '#FFF8F5', text: '#221A15', muted: '#52443C', outline: '#85736A', outlineVariant: '#D7C3B8', primary: '#9C4300', onPrimary: '#FFFFFF', track: '#F0E0D6', surfaceContainerHigh: '#F1E6DF', err: '#BA1A1A' };
    return {
      t,
      done: [
        { label: 'Drehstellung: Flügel bleibt stehen', meta: 'In Ordnung · 1 Foto' },
        { label: 'Kippstellung: Flügel hält Position', meta: 'In Ordnung · 1 Foto' }
      ],
      next: [
        { n: '4', label: 'Schließen & Verriegeln', line: t.outlineVariant },
        { n: '5', label: 'Glas, Rahmen & Beschläge', line: t.outlineVariant },
        { n: '6', label: 'Anschlussfugen & Fensterbank', line: 'transparent' }
      ]
    };
  }
}
</script>
</body>
</html>
