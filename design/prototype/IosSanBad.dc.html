<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot iOS – Bad OG Objekte prüfen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, -apple-system, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 50px 20px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 44px">
      <a href="IosSanUebersicht.dc.html" style="display: flex; align-items: center; gap: 2px; color: {{t.accent}}; text-decoration: none; font-size: 17px; min-height: 44px; margin-left: -6px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
        Sanitär
      </a>
      <span style="font-size: 15px; font-weight: 600; color: {{t.muted}}">Fertigmontage</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Bad OG</h1>
      <span style="font-size: 14px; color: {{t.muted}}">5 Objekte · 1 von 5 geprüft</span>
    </div>

    <div role="tablist" aria-label="Objekte" style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{objects}}" as="o" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{o.sel}}" style="height: 36px; padding: 0 12px; border-radius: 18px; border: {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
          <sc-if value="{{o.done}}" hint-placeholder-val="{{ false }}">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
          </sc-if>
          {{o.name}}
        </button>
      </sc-for>
    </div>

    <div style="border-radius: 16px; background: {{t.surface}}; border: 2px solid {{t.accent}}; padding: 16px; display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0 0 6px; font-size: 19px; font-weight: 700">Waschtisch</h2>
      <sc-for list="{{checks}}" as="c" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-top: {{c.divider}}">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 600">{{c.label}}</span>
            <span style="font-size: 13px; line-height: 1.35; color: {{t.muted}}">{{c.hint}}</span>
          </div>
          <div style="display: flex; gap: 6px">
            <button type="button" aria-label="{{c.mAria}}" style="width: 44px; height: 44px; border-radius: 12px; border: {{c.mBorder}}; background: {{c.mBg}}; color: {{c.mFg}}; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
            <button type="button" aria-label="{{c.okAria}}" style="width: 44px; height: 44px; border-radius: 12px; border: {{c.okBorder}}; background: {{c.okBg}}; color: {{c.okFg}}; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
            </button>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: {{t.surface}}">
      <svg aria-hidden="true" style="flex-shrink: 0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 16v-4M12 8h.01"></path></svg>
      <span style="font-size: 13px; line-height: 1.4; color: {{t.muted}}">Als Nächstes Dusche: 2 Minuten voll aufdrehen – der Ablauf muss alles schlucken, kein Wasser darf stehen bleiben.</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#121417', surface: '#1C1F23', text: '#F2F2F0', muted: '#A3A8AE', border: '#2A2E33', outline: '#3A3F45', accent: '#FB923C', onAccent: '#1A0E05', chip: '#262A2F', ok: '#22A355', okInk: '#FFFFFF', oSoft: '#16301F', oFg: '#86EFAC', err: '#F87171' }
      : { bg: '#F5F4F1', surface: '#FFFFFF', text: '#17191C', muted: '#5C6168', border: '#E2E0DB', outline: '#D6D3CC', accent: '#C2410C', onAccent: '#FFFFFF', chip: '#ECEAE5', ok: '#15803D', okInk: '#FFFFFF', oSoft: '#E3F4E8', oFg: '#166534', err: '#B91C1C' };
    const line = '1px solid ' + t.border;
    const O = {
      done: { bg: t.oSoft, fg: t.oFg, border: '0', done: true, sel: 'false' },
      now: { bg: t.accent, fg: t.onAccent, border: '0', done: false, sel: 'true' },
      open: { bg: 'transparent', fg: t.text, border: '1px solid ' + t.outline, done: false, sel: 'false' }
    };
    const objects = [['WC', 'done'], ['Waschtisch', 'now'], ['Dusche', 'open'], ['Heizkörper', 'open'], ['Lüfter', 'open']].map(([name, k]) => ({ name, ...O[k] }));
    const chk = (label, hint, ok, i) => ({
      label, hint, divider: i ? line : '0',
      okAria: label + ': in Ordnung', mAria: label + ': Mangel',
      okBg: ok ? t.ok : 'transparent', okFg: ok ? t.okInk : t.muted, okBorder: ok ? '0' : '1px solid ' + t.outline,
      mBg: 'transparent', mFg: t.muted, mBorder: '1px solid ' + t.outline
    });
    return {
      t,
      objects,
      checks: [
        chk('Warm links, kalt rechts', 'Hebel ganz nach links: Wasser wird warm.', true, 0),
        chk('Wasser läuft zügig ab', 'Becken voll laufen lassen, Stopfen ziehen.', true, 1),
        chk('Siphon & Anschlüsse trocken', 'Mit Papiertuch unten abwischen – muss trocken bleiben.', false, 2),
        chk('Armatur fest, kein Tropfen', 'Nach dem Zudrehen 1 Minute beobachten.', false, 3),
        chk('Silikonfuge geschlossen', 'Zwischen Becken und Wand ohne Lücken.', false, 4)
      ]
    };
  }
}
</script>
</body>
</html>
