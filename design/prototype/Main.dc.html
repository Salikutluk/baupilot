<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot iOS – Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 24px 32px; display: flex; flex-direction: column; gap: 22px; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, -apple-system, system-ui, sans-serif; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px">
    <div style="width: 40px; height: 40px; border-radius: 11px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-6h4v6"></path></svg>
    </div>
    <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.3px">Baupilot</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -0.6px">Ihr Bauvorhaben.<br>Ein Plan.</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: {{t.muted}}">Baupilot zeigt, wann welches Gewerk dran ist, ordnet Angebote und Dokumente und begleitet Sie von der Planung bis zur Abnahme.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{features}}" as="f" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 32px; height: 32px; border-radius: 9px; background: {{t.accentSoft}}; color: {{t.accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{f.icon}}"></path></svg>
        </div>
        <span style="font-size: 15px; font-weight: 500">{{f.label}}</span>
      </div>
    </sc-for>
  </div>
  <form style="display: flex; flex-direction: column; gap: 12px; margin-top: 4px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="ios-mail" style="font-size: 13px; font-weight: 600; color: {{t.muted}}">E-Mail</label>
      <input id="ios-mail" type="email" placeholder="name@beispiel.de" style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; padding: 0 14px; font: inherit; font-size: 16px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <label for="ios-pw" style="font-size: 13px; font-weight: 600; color: {{t.muted}}">Passwort</label>
        <a href="#" style="font-size: 13px; font-weight: 600; color: {{t.accent}}; text-decoration: none; min-height: 44px; display: flex; align-items: center; margin: -14px 0">Vergessen?</a>
      </div>
      <input id="ios-pw" type="password" placeholder="••••••••" style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; padding: 0 14px; font: inherit; font-size: 16px">
    </div>
  </form>
  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto">
    <a href="IosHome.dc.html" style="height: 52px; border-radius: 14px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; text-decoration: none">Anmelden</a>
    <button type="button" style="height: 52px; border-radius: 14px; border: 0; background: {{t.text}}; color: {{t.bg}}; display: flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-size: 17px; font-weight: 600">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.1 2.5-1.8 3.1-.5 7.6 1.3 10.1.8 1.2 1.8 2.6 3.1 2.5 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.4-1-2.4-4.2zM14 5.3c.7-.8 1.1-1.9 1-3-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 2.9 1.1.1 2.2-.6 2.9-1.4z"></path></svg>
      Mit Apple anmelden
    </button>
    <p style="margin: 6px 0 0; text-align: center; font-size: 14px; color: {{t.muted}}">Neu hier? <a href="#" style="color: {{t.accent}}; font-weight: 600; text-decoration: none">Bauvorhaben anlegen</a></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#121417', surface: '#1C1F23', text: '#F2F2F0', muted: '#A3A8AE', border: '#30353B', accent: '#FB923C', onAccent: '#1A0E05', accentSoft: '#3A2414' }
      : { bg: '#F5F4F1', surface: '#FFFFFF', text: '#17191C', muted: '#5C6168', border: '#DCDAD4', accent: '#C2410C', onAccent: '#FFFFFF', accentSoft: '#FDEBDD' };
    return {
      t,
      features: [
        { label: 'Zeitplan: wann welcher Handwerker kommt', icon: 'M8 2v4M16 2v4M3 9h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z' },
        { label: 'Angebote je Gewerk sammeln & vergleichen', icon: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M9 14l2 2 4-4' },
        { label: 'Begleitung von Planung bis Abnahme', icon: 'M4 19h16M6 15l4-4 3 3 5-6' }
      ]
    };
  }
}
</script>
</body>
</html>
