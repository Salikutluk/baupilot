<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot Android – Protokoll Rohbau</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9C4300}a:hover{color:#753400}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <header style="height: 64px; margin-top: 32px; padding: 0 4px; display: flex; align-items: center; gap: 4px">
    <a href="AndAbnGewerke.dc.html" aria-label="Zurück" style="width: 48px; height: 48px; border-radius: 24px; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-size: 20px">Rohbau</span>
      <span style="font-size: 13px; color: {{t.muted}}">Bauunternehmung Keller · Keller, EG, OG</span>
    </div>
  </header>

  <a href="AndAbnMaengel.dc.html" style="margin: 8px 16px 0; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background: {{t.warnBg}}; color: {{t.warnFg}}; text-decoration: none">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 15px; font-weight: 500">Abgenommen mit Vorbehalt</span>
      <span style="font-size: 13px">1 Mangel offen · Frist 15.12.2026</span>
    </span>
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
  </a>

  <sc-for list="{{groups}}" as="grp" hint-placeholder-count="3">
    <section>
      <h2 style="margin: 0; padding: 14px 16px 2px; font-size: 14px; font-weight: 500; color: {{t.primary}}">{{grp.title}}</h2>
      <sc-for list="{{grp.rows}}" as="r" hint-placeholder-count="3">
        <a href="{{r.href}}" style="display: flex; align-items: center; gap: 16px; min-height: 48px; padding: 0 16px; text-decoration: none; color: {{t.text}}">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{r.iconColor}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg>
          <span style="flex: 1; font-size: 15px">{{r.label}}</span>
          <span style="font-size: 13px; color: {{r.metaColor}}; font-weight: {{r.metaWeight}}; white-space: nowrap">{{r.meta}}</span>
        </a>
      </sc-for>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#16130F', text: '#ECE0D8', muted: '#D7C3B8', primary: '#FFB68E', ok: '#7FD889', err: '#FFB4AB', warnBg: '#3D3110', warnFg: '#F5D27A' }
      : { bg: '#FFF8F5', text: '#221A15', muted: '#52443C', primary: '#9C4300', ok: '#2E7D32', err: '#BA1A1A', warnBg: '#FCEBC0', warnFg: '#5C3F00' };
    const okIcon = 'M22 11.1V12a10 10 0 1 1-5.9-9.1M22 4L12 14l-3-3';
    const mIcon = 'M12 8v5M12 16.5h.01M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z';
    const rows = (rs) => rs.map(([label, meta, k, href]) => ({
      label, meta, href: href || '#',
      icon: k === 'm' ? mIcon : okIcon, iconColor: k === 'm' ? t.err : t.ok,
      metaColor: k === 'm' ? t.err : t.muted, metaWeight: k === 'm' ? '500' : '400'
    }));
    return {
      t,
      groups: [
        { title: 'Bodenplatte & Keller', rows: rows([
          ['Fundamenterder vor Betonieren', '3 Fotos'],
          ['Kellerabdichtung vor Verfüllen', '5 Fotos'],
          ['Kellerwand Nord ohne Risse', 'Mangel', 'm', 'AndAbnMaengel.dc.html']
        ]) },
        { title: 'Wände & Decken', rows: rows([
          ['Maße & Lot, Öffnungen', '12 Öffnungen', 'ok', 'AndRohbauMasse.dc.html'],
          ['Mauerwerk vollfugig, ohne Risse', '4 Fotos'],
          ['Aussparungen Leitungen & Treppe', '2 Fotos'],
          ['Stürze & Ringanker fotografiert', '3 Fotos']
        ]) },
        { title: 'Nachweise', rows: rows([
          ['Bewehrungsabnahme Statiker', 'Protokoll'],
          ['Lieferscheine Beton & Steine', '8 PDFs']
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
