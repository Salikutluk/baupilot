<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot Android – Zeitplan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9C4300}a:hover{color:#753400}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <header style="height: 64px; margin-top: 32px; padding: 0 16px; display: flex; flex-direction: column; justify-content: center">
    <span style="font-size: 22px; line-height: 28px">Zeitplan</span>
    <span style="font-size: 13px; color: {{t.muted}}">Einzug geplant September 2027</span>
  </header>

  <div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="border-radius: 16px; background: {{t.primaryContainer}}; color: {{t.onPrimaryContainer}}; padding: 12px 16px; display: flex; flex-direction: column">
      <span style="font-size: 14px; font-weight: 500; padding: 4px 0">Jetzt Handwerker anfragen</span>
      <sc-for list="{{asks}}" as="a" hint-placeholder-count="2">
        <a href="{{a.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; text-decoration: none; color: {{t.onPrimaryContainer}}">
          <span style="width: 10px; height: 10px; transform: rotate(45deg); background: {{t.primary}}; flex-shrink: 0"></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 16px">{{a.name}}</span>
            <span style="font-size: 13px">{{a.sub}}</span>
          </span>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </sc-for>
    </div>

    <div style="display: flex; gap: 14px; font-size: 12px; color: {{t.muted}}">
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.done}}"></span>Erledigt</span>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.primary}}"></span>Läuft</span>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.plan}}"></span>Geplant</span>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; transform: rotate(45deg); background: {{t.primary}}"></span>Anfragen</span>
    </div>

    <div role="img" aria-label="Zeitplan aller Gewerke von März 2026 bis September 2027, heute Mitte Dezember 2026" style="display: flex; flex-direction: column">
      <div style="display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 8px; height: 20px">
        <span></span>
        <div style="position: relative">
          <sc-for list="{{months}}" as="m" hint-placeholder-count="5">
            <span style="position: absolute; left: {{m.left}}%; font-size: 11px; font-weight: 500; color: {{t.muted}}; white-space: nowrap">{{m.label}}</span>
          </sc-for>
        </div>
      </div>
      <div style="position: relative">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="11">
          <div style="display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 8px; align-items: center; height: 33px; border-top: 1px solid {{t.divider}}">
            <span style="font-size: 13px; font-weight: {{r.weight}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
            <div style="position: relative; height: 33px">
              <span style="position: absolute; top: 11px; left: {{r.left}}%; width: {{r.width}}%; min-width: 10px; height: 12px; border-radius: 6px; background: {{r.color}}"></span>
              <sc-if value="{{r.ask}}" hint-placeholder-val="{{ false }}">
                <span style="position: absolute; top: 13px; left: calc({{r.askLeft}}% - 4px); width: 8px; height: 8px; transform: rotate(45deg); background: {{t.primary}}; outline: 2px solid {{t.bg}}"></span>
              </sc-if>
            </div>
          </div>
        </sc-for>
        <div style="position: absolute; top: 0; bottom: 0; left: calc(126px + (100% - 126px) * {{todayFrac}}); width: 2px; background: {{t.text}}"></div>
      </div>
      <div style="display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 8px; padding-top: 4px">
        <span></span>
        <span style="padding-left: calc({{todayPct}}% - 14px); font-size: 11px; font-weight: 700">Heute</span>
      </div>
    </div>
  </div>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; box-sizing: border-box; padding-top: 12px; background: {{t.surfaceContainer}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <sc-for list="{{tabs}}" as="b" hint-placeholder-count="5">
      <a href="{{b.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{b.color}}; font-size: 12px; font-weight: {{b.weight}}">
        <span style="width: 56px; height: 32px; border-radius: 16px; background: {{b.pill}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.icon}}"></path></svg>
        </span>
        {{b.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#16130F', text: '#ECE0D8', muted: '#D7C3B8', divider: '#3A332E', primary: '#FFB68E', primaryContainer: '#753400', onPrimaryContainer: '#FFDBCA', secondaryContainer: '#5C4032', surfaceContainer: '#231F1B', done: '#7FD889', plan: '#6B5E55' }
      : { bg: '#FFF8F5', text: '#221A15', muted: '#52443C', divider: '#E4D7CF', primary: '#9C4300', primaryContainer: '#FFDBCA', onPrimaryContainer: '#331200', secondaryContainer: '#FFDBCA', surfaceContainer: '#F7ECE6', done: '#2E7D32', plan: '#C4AFA3' };
    const SPAN = 19;
    const today = 9.6; // Mitte Dezember 2026
    const pct = (m) => (m / SPAN * 100).toFixed(2);
    const raw = [
      ['Erdarbeiten', 0, 1.5], ['Rohbau', 1.5, 8], ['Zimmerer', 8, 8.9], ['Dachdecker', 8.8, 9.5], ['Fenster & Türen', 9.4, 10],
      ['Elektro', 10.1, 12], ['Sanitär & Heizung', 10.6, 12.2], ['Estrich', 11.6, 13], ['Fliesen', 12.6, 14], ['Maler', 13.4, 15], ['Außenanlagen', 15.5, 18]
    ];
    const rows = raw.map(([name, a, b]) => {
      const state = b <= today ? 'done' : a <= today ? 'run' : 'plan';
      const askAt = a - 2;
      return {
        name, left: pct(a), width: pct(b - a),
        color: state === 'done' ? t.done : state === 'run' ? t.primary : t.plan,
        weight: state === 'run' ? '700' : '400',
        ask: state === 'plan' && askAt >= today - 0.5 && askAt < today + 2, askLeft: pct(Math.max(askAt, 0))
      };
    });
    const tab = (label, icon, href, on) => ({ label, icon, href, color: on ? t.text : t.muted, weight: on ? '700' : '500', pill: on ? t.secondaryContainer : 'transparent' });
    return {
      t,
      rows,
      todayFrac: (today / SPAN).toFixed(4),
      todayPct: pct(today),
      months: [[0, 'Mär 26'], [4, 'Jul'], [8, 'Nov'], [12, 'Mär 27'], [16, 'Jul']].map(([m, label]) => ({ left: pct(m), label })),
      asks: [
        { name: 'Estrich', sub: 'Start KW 8 · Angebote bis 15.01.', href: 'AndGewerk.dc.html' },
        { name: 'Fliesen & Maler', sub: 'Start März · jetzt je 3 Angebote einholen', href: '#' }
      ],
      tabs: [
        tab('Übersicht', 'M3 11l9-7 9 7M5 10v10h14V10', 'AndHome.dc.html', false),
        tab('Zeitplan', 'M8 2v4M16 2v4M3 9h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z', 'AndZeitplan.dc.html', true),
        tab('Abnahmen', 'M9 3h6v4H9zM9 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3M9 14l2 2 4-4', 'AndAbnGewerke.dc.html', false),
        tab('Dokumente', 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z', 'AndDokumente.dc.html', false),
        tab('Profil', 'M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z', 'AndProfil.dc.html', false)
      ]
    };
  }
}
</script>
</body>
</html>
