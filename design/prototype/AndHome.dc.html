<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot Android – Übersicht</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9C4300}a:hover{color:#753400}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <header style="height: 64px; margin-top: 32px; padding: 0 4px 0 16px; display: flex; align-items: center; gap: 8px">
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-size: 22px; line-height: 28px">Übersicht</span>
      <span style="font-size: 13px; color: {{t.muted}}">Einfamilienhaus · Musterweg 12</span>
    </div>
    <a href="AndMitteilungen.dc.html" aria-label="Mitteilungen, 2 neu" style="width: 48px; height: 48px; border-radius: 24px; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; position: relative">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span style="position: absolute; top: 11px; right: 12px; min-width: 16px; height: 16px; border-radius: 8px; background: {{t.error}}; color: {{t.onError}}; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center">2</span>
    </a>
  </header>

  <div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="background: {{t.primaryContainer}}; color: {{t.onPrimaryContainer}}; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 500">
        <span>Aktuelle Phase</span>
        <span>5 / 11</span>
      </div>
      <span style="font-size: 28px; line-height: 36px">Fenster &amp; Türen</span>
      <div style="height: 4px; border-radius: 2px; background: {{t.track}}">
        <div style="width: 45%; height: 4px; border-radius: 2px; background: {{t.primary}}"></div>
      </div>
      <span style="font-size: 14px">Einzug geplant September 2027</span>
    </div>

    <div style="display: flex; flex-direction: column">
      <div style="display: flex; justify-content: space-between; align-items: center; height: 40px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 500; color: {{t.primary}}">Als Nächstes benötigt</h2>
        <a href="#" style="font-size: 14px; font-weight: 500; color: {{t.primary}}; text-decoration: none; padding: 10px 12px; margin-right: -12px">Alle</a>
      </div>
      <sc-for list="{{trades}}" as="g" hint-placeholder-count="3">
        <a href="AndGewerk.dc.html" style="display: flex; align-items: center; gap: 16px; min-height: 64px; text-decoration: none; color: {{t.text}}">
          <div style="width: 40px; height: 40px; border-radius: 20px; background: {{t.secondaryContainer}}; color: {{t.onSecondaryContainer}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; font-weight: 500">{{g.initial}}</div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px">{{g.name}}</span>
            <span style="font-size: 14px; color: {{t.muted}}">{{g.when}}</span>
          </div>
          <span style="height: 32px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; font-size: 13px; font-weight: 500; background: {{g.bg}}; color: {{g.fg}}; border: {{g.border}}; white-space: nowrap">{{g.status}}</span>
        </a>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 500; color: {{t.primary}}; height: 32px; display: flex; align-items: center">Dokumente</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{docs}}" as="d" hint-placeholder-count="4">
          <a href="AndDokumente.dc.html" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; background: {{t.surfaceContainer}}; display: flex; align-items: center; gap: 12px; text-decoration: none; color: {{t.text}}">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{d.icon}}"></path></svg>
            <span style="flex: 1; font-size: 14px; font-weight: 500">{{d.label}}</span>
            <span style="font-size: 14px; color: {{t.muted}}">{{d.count}}</span>
          </a>
        </sc-for>
      </div>
    </div>
  </div>

  <a href="#" style="position: absolute; right: 16px; bottom: 96px; height: 56px; box-sizing: border-box; padding: 0 20px 0 16px; border-radius: 16px; background: {{t.primaryContainer}}; color: {{t.onPrimaryContainer}}; display: flex; align-items: center; gap: 10px; text-decoration: none; font-size: 15px; font-weight: 500; box-shadow: 0 3px 8px rgba(0,0,0,0.18)">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    Dokument
  </a>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; box-sizing: border-box; padding-top: 12px; background: {{t.surfaceContainer}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <sc-for list="{{tabs}}" as="b" hint-placeholder-count="5">
      <a href="{{b.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{b.color}}; font-size: 12px; font-weight: {{b.weight}}">
        <span style="width: 56px; height: 32px; border-radius: 16px; background: {{b.pill}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.icon}}"></path></svg>
        </span>
        {{b.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#16130F', text: '#ECE0D8', muted: '#D7C3B8', outline: '#A08D83', primary: '#FFB68E', primaryContainer: '#753400', onPrimaryContainer: '#FFDBCA', track: '#3D1A00', secondaryContainer: '#5C4032', onSecondaryContainer: '#FFDBCA', tertiaryContainer: '#4F4700', onTertiaryContainer: '#F2E48A', surfaceContainer: '#231F1B', error: '#FFB4AB', onError: '#690005', okBg: '#1F3A22', okFg: '#A6F0A6', infoBg: '#1E3150', infoFg: '#C7DBFF' }
      : { bg: '#FFF8F5', text: '#221A15', muted: '#52443C', outline: '#85736A', primary: '#9C4300', primaryContainer: '#FFDBCA', onPrimaryContainer: '#331200', track: '#F5B892', secondaryContainer: '#FFDBCA', onSecondaryContainer: '#2B160B', tertiaryContainer: '#F2E48A', onTertiaryContainer: '#201C00', surfaceContainer: '#F7ECE6', error: '#BA1A1A', onError: '#FFFFFF', okBg: '#D7F5D3', okFg: '#14501C', infoBg: '#DCE6FF', infoFg: '#163C7A' };
    const tab = (label, icon, href, on) => ({ label, icon, href, color: on ? t.text : t.muted, weight: on ? '700' : '500', pill: on ? t.secondaryContainer : 'transparent' });
    return {
      t,
      trades: [
        { initial: 'El', name: 'Elektriker', when: 'ab KW 3 · Rohinstallation', status: 'Beauftragt', bg: t.okBg, fg: t.okFg, border: '0' },
        { initial: 'In', name: 'Installateur', when: 'ab KW 5 · 2 Angebote da', status: 'Vergleichen', bg: t.infoBg, fg: t.infoFg, border: '0' },
        { initial: 'Es', name: 'Estrich', when: 'ab KW 8 · Frist 15.01.', status: 'Anfragen', bg: 'transparent', fg: t.primary, border: '1px solid ' + t.outline }
      ],
      docs: [
        { label: 'Angebote', count: '7', icon: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6' },
        { label: 'Verträge', count: '3', icon: 'M9 12l2 2 4-4M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z' },
        { label: 'Rechnungen', count: '4', icon: 'M4 2v20l3-2 3 2 3-2 3 2 3-2 1 1V2zM8 8h8M8 12h8M8 16h5' },
        { label: 'Pläne', count: '12', icon: 'M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15' }
      ],
      tabs: [
        tab('Übersicht', 'M3 11l9-7 9 7M5 10v10h14V10', 'AndHome.dc.html', true),
        tab('Zeitplan', 'M8 2v4M16 2v4M3 9h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z', 'AndZeitplan.dc.html', false),
        tab('Abnahmen', 'M9 3h6v4H9zM9 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3M9 14l2 2 4-4', 'AndAbnGewerke.dc.html', false),
        tab('Dokumente', 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z', 'AndDokumente.dc.html', false),
        tab('Profil', 'M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z', 'AndProfil.dc.html', false)
      ]
    };
  }
}
</script>
</body>
</html>
