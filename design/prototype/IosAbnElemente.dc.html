<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot iOS – Abnahme Fenster und Türen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, -apple-system, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 50px 20px 110px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; height: 44px">
      <a href="IosAbnGewerke.dc.html" style="display: flex; align-items: center; gap: 2px; color: {{t.accent}}; text-decoration: none; font-size: 17px; min-height: 44px; margin-left: -6px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
        Abnahmen
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.6px">Fenster &amp; Türen</h1>
      <span style="font-size: 14px; color: {{t.muted}}">Fensterbau Weber GmbH · Fr, 18.12.2026</span>
    </div>

    <div style="background: {{t.surface}}; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 16px; font-weight: 600">7 von 12 Elementen geprüft</span>
        <a href="#" style="font-size: 14px; font-weight: 600; color: {{t.accent}}; text-decoration: none; min-height: 44px; display: flex; align-items: center; margin: -12px 0">Anleitung</a>
      </div>
      <div style="display: flex; gap: 3px; height: 8px">
        <sc-for list="{{segs}}" as="s" hint-placeholder-count="12">
          <span style="flex: 1; border-radius: 3px; background: {{s.c}}"></span>
        </sc-for>
      </div>
      <div style="display: flex; gap: 14px; font-size: 13px; color: {{t.muted}}">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{t.ok}}"></span>6 in Ordnung</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{t.err}}"></span>1 Mangel</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{t.track}}"></span>5 offen</span>
      </div>
    </div>

    <sc-for list="{{floors}}" as="fl" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 0 4px"><h2 style="margin: 0; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: {{t.muted}}">{{fl.title}}</h2><a href="#" style="font-size: 13px; font-weight: 600; color: {{t.accent}}; text-decoration: none; min-height: 44px; display: flex; align-items: center; margin: -14px 0">{{fl.more}}</a></div>
        <div style="background: {{t.surface}}; border-radius: 16px; overflow: hidden">
          <sc-for list="{{fl.items}}" as="e" hint-placeholder-count="3">
            <a href="{{e.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 14px; text-decoration: none; color: {{t.text}}; border-top: {{e.divider}}">
              <span style="width: 36px; height: 36px; border-radius: 10px; background: {{t.chip}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: {{t.muted}}; flex-shrink: 0">{{e.id}}</span>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 15px; font-weight: 600">{{e.room}}</span>
                <span style="font-size: 13px; color: {{t.muted}}">{{e.type}}</span>
              </div>
              <span style="font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 7px; background: {{e.bg}}; color: {{e.fg}}; white-space: nowrap">{{e.status}}</span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 20px 34px; background: {{t.bar}}; border-top: 1px solid {{t.border}}">
    <a href="IosAbnPruefung.dc.html" style="height: 50px; border-radius: 14px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; text-decoration: none">Weiter prüfen: F8 · Schlafen</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#121417', surface: '#1C1F23', text: '#F2F2F0', muted: '#A3A8AE', border: '#2A2E33', accent: '#FB923C', onAccent: '#1A0E05', chip: '#262A2F', track: '#3A3F45', bar: '#17191CF2', ok: '#4ADE80', err: '#F87171', aSoft: '#3A2414', aFg: '#FDBA74', oSoft: '#16301F', oFg: '#86EFAC', eSoft: '#3B1717', eFg: '#FCA5A5' }
      : { bg: '#F5F4F1', surface: '#FFFFFF', text: '#17191C', muted: '#5C6168', border: '#E2E0DB', accent: '#C2410C', onAccent: '#FFFFFF', chip: '#F0EEEA', track: '#DEDBD5', bar: '#FFFFFFF2', ok: '#15803D', err: '#DC2626', aSoft: '#FDEBDD', aFg: '#9A3412', oSoft: '#E3F4E8', oFg: '#166534', eSoft: '#FDE7E7', eFg: '#991B1B' };
    const line = '1px solid ' + t.border;
    const S = { ok: ['In Ordnung', t.oSoft, t.oFg], m: ['1 Mangel', t.eSoft, t.eFg], run: ['Schritt 3/6', t.aSoft, t.aFg], open: ['Offen', t.chip, t.muted] };
    const items = (list) => list.map(([id, room, type, k], i) => ({ id, room, type, status: S[k][0], bg: S[k][1], fg: S[k][2], divider: i ? line : '0', href: k === 'run' ? 'IosAbnPruefung.dc.html' : (k === 'm' ? 'IosAbnMangel.dc.html' : '#') }));
    const segs = ['ok','m','ok','ok','ok','ok','ok','o','o','o','o','o'].map((k) => ({ c: k === 'ok' ? t.ok : k === 'm' ? t.err : t.track }));
    return {
      t,
      segs,
      floors: [
        { title: 'Erdgeschoss', more: 'Alle 6', items: items([['F1', 'Wohnen', 'Hebe-Schiebe-Tür', 'ok'], ['F2', 'Wohnen', 'Dreh-Kipp, 1-flügelig', 'm'], ['F3', 'Küche', 'Dreh-Kipp, 1-flügelig', 'ok']]) },
        { title: 'Obergeschoss', more: 'Alle 6', items: items([['F7', 'Kind 1', 'Dreh-Kipp, 1-flügelig', 'ok'], ['F8', 'Schlafen', 'Dreh-Kipp, 1-flügelig', 'run'], ['F9', 'Bad', 'Kipp, Ornamentglas', 'open']]) }
      ]
    };
  }
}
</script>
</body>
</html>
