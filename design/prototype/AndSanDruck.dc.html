<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot Android – Druckprobe Trinkwasser</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9C4300}a:hover{color:#753400}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <header style="height: 64px; margin-top: 32px; padding: 0 16px 0 4px; display: flex; align-items: center; gap: 4px">
    <a href="AndSanUebersicht.dc.html" aria-label="Schließen" style="width: 48px; height: 48px; border-radius: 24px; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-size: 20px">Druckprobe Trinkwasser</span>
      <span style="font-size: 13px; color: {{t.muted}}">Mit Installateur · vor dem Verschließen</span>
    </div>
    <span style="font-size: 14px; font-weight: 500; color: {{t.muted}}">3 / 5</span>
  </header>
  <div style="height: 4px; margin: 0 16px; border-radius: 2px; background: {{t.track}}">
    <div style="width: 50%; height: 4px; border-radius: 2px; background: {{t.primary}}"></div>
  </div>

  <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{done}}" as="s" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 16px; min-height: 44px">
          <span style="width: 24px; height: 24px; border-radius: 12px; background: {{t.primary}}; color: {{t.onPrimary}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
          </span>
          <span style="flex: 1; font-size: 15px">{{s.label}}</span>
          <span style="font-size: 13px; font-weight: 500">{{s.meta}}</span>
        </div>
      </sc-for>
    </div>

    <div style="border-radius: 16px; background: {{t.surfaceContainer}}; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 24px; height: 24px; border-radius: 12px; background: {{t.primary}}; color: {{t.onPrimary}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; flex-shrink: 0">3</span>
        <h2 style="margin: 0; font-size: 18px; font-weight: 500">Manometer am Ende ablesen</h2>
      </div>
      <div style="display: flex; align-items: center; gap: 14px">
        <div style="width: 72px; height: 72px; border-radius: 36px; background: conic-gradient({{t.primary}} 0 58%, {{t.track}} 58% 100%); display: flex; align-items: center; justify-content: center; flex-shrink: 0" role="img" aria-label="Prüfzeit zu 58 Prozent abgelaufen">
          <span style="width: 58px; height: 58px; border-radius: 29px; background: {{t.surfaceContainer}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500">12:40</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 500">Noch 12:40 Min. Prüfzeit</span>
          <span style="font-size: 13px; line-height: 18px; color: {{t.muted}}">Prüfdruck und Dauer legt der Installateur fest.</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="position: relative">
          <span style="position: absolute; top: -8px; left: 12px; padding: 0 4px; background: {{t.surfaceContainer}}; font-size: 12px; color: {{t.muted}}">Start (10:02)</span>
          <span style="height: 56px; box-sizing: border-box; border-radius: 4px; border: 1px solid {{t.outline}}; display: flex; align-items: center; padding: 0 15px; font-size: 16px">10,0 bar</span>
        </div>
        <div style="position: relative">
          <label for="and-druck-ende" style="position: absolute; top: -8px; left: 12px; padding: 0 4px; background: {{t.surfaceContainer}}; font-size: 12px; color: {{t.primary}}">Ende</label>
          <input id="and-druck-ende" type="text" placeholder="– bar" style="width: 100%; height: 56px; box-sizing: border-box; border-radius: 4px; border: 2px solid {{t.primary}}; background: transparent; color: {{t.text}}; padding: 0 14px; font: inherit; font-size: 16px">
        </div>
      </div>
      <button type="button" style="height: 48px; border-radius: 24px; border: 1px solid {{t.outline}}; background: transparent; color: {{t.primary}}; display: flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-size: 15px; font-weight: 500">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        Manometer fotografieren
      </button>
    </div>

    <div style="display: flex; flex-direction: column">
      <sc-for list="{{next}}" as="s" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 16px; min-height: 44px">
          <span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{t.outline}}; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; flex-shrink: 0">{{s.n}}</span>
          <span style="flex: 1; font-size: 15px; color: {{t.muted}}">{{s.label}}</span>
          <span style="font-size: 12px; font-weight: 500; color: {{s.tagColor}}">{{s.tag}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#16130F', text: '#ECE0D8', muted: '#D7C3B8', outline: '#A08D83', primary: '#FFB68E', onPrimary: '#532200', track: '#3E3630', surfaceContainer: '#231F1B', err: '#FFB4AB' }
      : { bg: '#FFF8F5', text: '#221A15', muted: '#52443C', outline: '#85736A', primary: '#9C4300', onPrimary: '#FFFFFF', track: '#F0E0D6', surfaceContainer: '#F7ECE6', err: '#BA1A1A' };
    return {
      t,
      done: [
        { label: 'Leitungen sichtbar & beschriftet', meta: '3 Fotos' },
        { label: 'Manometer zu Beginn', meta: '10,0 bar' }
      ],
      next: [
        { n: '4', label: 'Alle Verbindungen trocken', tag: '', tagColor: t.muted },
        { n: '5', label: 'Druckprüfprotokoll unterschrieben', tag: 'Pflicht', tagColor: t.err }
      ]
    };
  }
}
</script>
</body>
</html>
