<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot iOS – Prüfschritt Fenster F8</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, -apple-system, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 50px 20px 40px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 44px">
      <a href="IosAbnElemente.dc.html" style="display: flex; align-items: center; gap: 2px; color: {{t.accent}}; text-decoration: none; font-size: 17px; min-height: 44px; margin-left: -6px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
        Fenster &amp; Türen
      </a>
      <span style="font-size: 15px; font-weight: 600; color: {{t.muted}}">Schritt 3 von 6</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">F8 · Schlafen</h1>
      <span style="font-size: 14px; color: {{t.muted}}">Obergeschoss · Dreh-Kipp-Fenster, 1-flügelig</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{done}}" as="s" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px; border-radius: 12px; background: {{t.surface}}">
          <span style="width: 22px; height: 22px; border-radius: 11px; background: {{t.ok}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.okInk}}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
          </span>
          <span style="flex: 1; font-size: 15px; color: {{t.muted}}">{{s.label}}</span>
          <span style="font-size: 13px; color: {{t.muted}}">{{s.photos}}</span>
        </div>
      </sc-for>

      <div style="border-radius: 16px; background: {{t.surface}}; border: 2px solid {{t.accent}}; padding: 16px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 26px; height: 26px; border-radius: 13px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0">3</span>
          <h2 style="margin: 0; font-size: 19px; font-weight: 700">Sitzt das Fenster im Wasser?</h2>
        </div>
        <p style="margin: 0; font-size: 15px; line-height: 1.45; color: {{t.muted}}">Wasserwaage oben und seitlich an den Rahmen halten – die Blase muss jeweils mittig stehen.</p>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <div style="height: 84px; border-radius: 10px; background: {{t.chip}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.muted}}; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="56" height="44" viewBox="0 0 56 44"><rect x="8" y="12" width="32" height="30" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"></rect><line x1="24" y1="12" x2="24" y2="42" stroke="currentColor" stroke-width="1.5"></line><rect x="6" y="3" width="36" height="6" rx="2" fill="{{t.accent}}"></rect><circle cx="24" cy="6" r="2" fill="{{t.chip}}"></circle><rect x="45" y="12" width="6" height="30" rx="2" fill="{{t.accent}}"></rect><circle cx="48" cy="27" r="2" fill="{{t.chip}}"></circle></svg>So prüfen</div>
          <div style="height: 84px; border-radius: 10px; position: relative; overflow: hidden; background: linear-gradient(160deg, #A9B7C0 0%, #6F8090 60%, #56626C 100%)"><svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 100 80" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0"><rect x="22" y="10" width="56" height="62" fill="none" stroke="#F4F6F7" stroke-width="5"></rect><line x1="50" y1="10" x2="50" y2="72" stroke="#F4F6F7" stroke-width="3"></line><rect x="18" y="4" width="64" height="7" rx="2" fill="#E8B23A"></rect></svg><span style="position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 10px; background: #15803D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span><span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 6px; background: rgba(0,0,0,0.45); color: #FFFFFF; font-size: 11px; font-weight: 600">Foto oben</span></div>
          <button type="button" style="height: 84px; border-radius: 10px; border: 1.5px dashed {{t.accent}}; background: transparent; color: {{t.accent}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: inherit; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Foto seitlich</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <a href="IosAbnMangel.dc.html" style="height: 50px; border-radius: 14px; border: 1.5px solid {{t.err}}; color: {{t.err}}; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 600; text-decoration: none">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
            Mangel
          </a>
          <button type="button" style="height: 50px; border-radius: 14px; border: 0; background: {{t.ok}}; color: {{t.okInk}}; display: flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-size: 16px; font-weight: 600">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
            In Ordnung
          </button>
        </div>
      </div>

      <sc-for list="{{next}}" as="s" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px">
          <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; border: 2px solid {{t.track}}; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: {{t.muted}}; flex-shrink: 0">{{s.n}}</span>
          <span style="font-size: 15px">{{s.label}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#121417', surface: '#1C1F23', text: '#F2F2F0', muted: '#A3A8AE', accent: '#FB923C', onAccent: '#1A0E05', chip: '#262A2F', track: '#4A5057', ok: '#4ADE80', okInk: '#0B1F12', err: '#F87171' }
      : { bg: '#F5F4F1', surface: '#FFFFFF', text: '#17191C', muted: '#5C6168', accent: '#C2410C', onAccent: '#FFFFFF', chip: '#F0EEEA', track: '#C9C6BF', ok: '#15803D', okInk: '#FFFFFF', err: '#B91C1C' };
    return {
      t,
      done: [
        { label: 'Drehstellung: Flügel bleibt stehen', photos: '1 Foto' },
        { label: 'Kippstellung: Flügel hält Position', photos: '1 Foto' }
      ],
      next: [
        { n: '4', label: 'Schließen & Verriegeln, Griff leichtgängig' },
        { n: '5', label: 'Glas, Rahmen & Beschläge unbeschädigt' },
        { n: '6', label: 'Anschlussfugen & Fensterbank dicht' }
      ]
    };
  }
}
</script>
</body>
</html>
