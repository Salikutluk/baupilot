<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot Android – Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 28px; display: flex; flex-direction: column; gap: 24px; background: {{t.bg}}; color: {{t.text}}; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <div style="width: 56px; height: 56px; border-radius: 16px; background: {{t.primaryContainer}}; color: {{t.onPrimaryContainer}}; display: flex; align-items: center; justify-content: center">
    <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-6h4v6"></path></svg>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 400">Willkommen bei Baupilot</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; color: {{t.muted}}">Sehen Sie, wann welches Gewerk benötigt wird, ordnen Sie Angebote und Dokumente und behalten Sie den ganzen Bau im Blick.</p>
  </div>
  <div style="display: flex; gap: 8px; flex-wrap: wrap">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
      <span style="height: 32px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid {{t.outline}}; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: {{t.muted}}">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.primary}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
        {{c}}
      </span>
    </sc-for>
  </div>
  <form style="display: flex; flex-direction: column; gap: 16px">
    <div style="position: relative">
      <label for="and-mail" style="position: absolute; top: -8px; left: 12px; padding: 0 4px; background: {{t.bg}}; font-size: 12px; color: {{t.primary}}">E-Mail</label>
      <input id="and-mail" type="email" placeholder="name@beispiel.de" style="width: 100%; height: 56px; box-sizing: border-box; border-radius: 4px; border: 2px solid {{t.primary}}; background: transparent; color: {{t.text}}; padding: 0 14px; font: inherit; font-size: 16px">
    </div>
    <div style="position: relative">
      <label for="and-pw" style="position: absolute; top: -8px; left: 12px; padding: 0 4px; background: {{t.bg}}; font-size: 12px; color: {{t.muted}}">Passwort</label>
      <input id="and-pw" type="password" placeholder="••••••••" style="width: 100%; height: 56px; box-sizing: border-box; border-radius: 4px; border: 1px solid {{t.outline}}; background: transparent; color: {{t.text}}; padding: 0 15px; font: inherit; font-size: 16px">
    </div>
    <a href="#" style="align-self: flex-end; min-height: 48px; display: flex; align-items: center; padding: 0 12px; margin: -12px -12px -4px 0; border-radius: 24px; font-size: 14px; font-weight: 500; color: {{t.primary}}; text-decoration: none">Passwort vergessen?</a>
  </form>
  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: auto">
    <a href="AndHome.dc.html" style="height: 48px; border-radius: 24px; background: {{t.primary}}; color: {{t.onPrimary}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; letter-spacing: 0.1px; text-decoration: none">Anmelden</a>
    <button type="button" style="height: 48px; border-radius: 24px; border: 1px solid {{t.outline}}; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center; gap: 10px; font: inherit; font-size: 15px; font-weight: 500">
      <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 10px; border: 2px solid {{t.muted}}; box-sizing: border-box; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; color: {{t.muted}}">G</span>
      Mit Google anmelden
    </button>
    <a href="#" style="height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: {{t.primary}}; text-decoration: none">Neues Bauvorhaben anlegen</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#16130F', text: '#ECE0D8', muted: '#D7C3B8', outline: '#A08D83', primary: '#FFB68E', onPrimary: '#532200', primaryContainer: '#753400', onPrimaryContainer: '#FFDBCA' }
      : { bg: '#FFF8F5', text: '#221A15', muted: '#52443C', outline: '#85736A', primary: '#9C4300', onPrimary: '#FFFFFF', primaryContainer: '#FFDBCA', onPrimaryContainer: '#331200' };
    return { t, chips: ['Zeitplan', 'Angebote', 'Dokumente'] };
  }
}
</script>
</body>
</html>
