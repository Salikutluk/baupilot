<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot iOS – Dokumente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, -apple-system, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 58px 20px 100px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">26 Dokumente · 11 Gewerke</span>
        <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.6px">Dokumente</h1>
      </div>
      <button type="button" aria-label="Dokument hinzufügen" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>

    <label style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; background: {{t.chip}}; display: flex; align-items: center; gap: 8px; color: {{t.muted}}">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-4.3-4.3"></path></svg>
      <input type="search" placeholder="Firma, Gewerk oder Betrag suchen" aria-label="Dokumente durchsuchen" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 16px; color: {{t.text}}; outline: none">
    </label>

    <div role="tablist" aria-label="Dokumenttyp" style="display: flex; gap: 8px; margin: 0 -20px; padding: 0 20px; overflow: hidden">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{f.selected}}" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 0; background: {{f.bg}}; color: {{f.fg}}; font: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; flex-shrink: 0">{{f.text}}</button>
      </sc-for>
    </div>

    <a href="#" style="background: {{t.aSoft}}; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: {{t.text}}">
      <span style="width: 36px; height: 36px; border-radius: 10px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v6l4 2M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z"></path></svg>
      </span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600">Rechnung prüfen &amp; zahlen</span>
        <span style="font-size: 13px; color: {{t.aFg}}">Fenster &amp; Türen · fällig 22.12.</span>
      </span>
      <span style="font-size: 15px; font-weight: 700; white-space: nowrap">18.400 €</span>
    </a>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <h2 style="margin: 0; font-size: 20px; font-weight: 700">Zuletzt hinzugefügt</h2>
        <a href="#" style="font-size: 15px; font-weight: 600; color: {{t.accent}}; text-decoration: none; min-height: 44px; margin: -12px 0; display: flex; align-items: center">Nach Gewerk</a>
      </div>
      <div style="background: {{t.surface}}; border-radius: 16px; overflow: hidden">
        <sc-for list="{{docs}}" as="d" hint-placeholder-count="5">
          <a href="{{d.href}}" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; text-decoration: none; color: {{t.text}}; border-top: {{d.divider}}">
            <span style="width: 38px; height: 38px; border-radius: 10px; background: {{d.iconBg}}; color: {{d.iconFg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{d.icon}}"></path></svg>
            </span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.title}}</span>
              <span style="font-size: 13px; color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.meta}}</span>
            </span>
            <span style="font-size: 14px; font-weight: 600; color: {{d.rightColor}}; white-space: nowrap">{{d.right}}</span>
          </a>
        </sc-for>
      </div>
    </div>
  </div>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 4px 0; background: {{t.bar}}; border-top: 1px solid {{t.border}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <sc-for list="{{tabs}}" as="b" hint-placeholder-count="5">
      <a href="{{b.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{b.color}}; font-size: 10px; font-weight: 600; min-height: 44px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.icon}}"></path></svg>
        {{b.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#121417', surface: '#1C1F23', text: '#F2F2F0', muted: '#A3A8AE', border: '#2A2E33', accent: '#FB923C', onAccent: '#1A0E05', chip: '#262A2F', bar: '#17191CF2', aSoft: '#3A2414', aFg: '#FDBA74', iSoft: '#1A2740', iFg: '#93C5FD', oSoft: '#16301F', oFg: '#86EFAC', pSoft: '#2B2440', pFg: '#C4B5FD' }
      : { bg: '#F5F4F1', surface: '#FFFFFF', text: '#17191C', muted: '#5C6168', border: '#E2E0DB', accent: '#C2410C', onAccent: '#FFFFFF', chip: '#ECEAE5', bar: '#FFFFFFF2', aSoft: '#FDEBDD', aFg: '#9A3412', iSoft: '#E3EBFC', iFg: '#1E40AF', oSoft: '#E3F4E8', oFg: '#166534', pSoft: '#EEEAFB', pFg: '#5B21B6' };
    const line = '1px solid ' + t.border;
    const I = {
      angebot: ['M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6', t.iSoft, t.iFg],
      vertrag: ['M9 12l2 2 4-4M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z', t.oSoft, t.oFg],
      rechnung: ['M4 2v20l3-2 3 2 3-2 3 2 3-2 1 1V2zM8 8h8M8 12h8M8 16h5', t.aSoft, t.aFg],
      plan: ['M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15', t.pSoft, t.pFg]
    };
    const docs = [
      ['angebot', 'Angebot Fließestrich Hahn', 'Estrich · 14.12.', '10.450 €', 'IosDokViewer.dc.html'],
      ['angebot', 'Angebot Estrichbau Wagner', 'Estrich · 10.12.', '9.800 €', 'IosDokViewer.dc.html'],
      ['rechnung', '2. Abschlagsrechnung', 'Fenster & Türen · 08.12. · offen', '18.400 €', '#'],
      ['vertrag', 'Werkvertrag Elektro Schmitt', 'Elektro · unterschrieben 01.12.', '', '#'],
      ['plan', 'Grundriss Obergeschoss', 'Architekt · Index C · 20.11.', '', '#']
    ].map(([k, title, meta, right, href], i) => ({ title, meta, right, href, icon: I[k][0], iconBg: I[k][1], iconFg: I[k][2], rightColor: k === 'rechnung' ? t.aFg : t.text, divider: i ? line : '0' }));
    const f = (label, n, on) => ({ text: label + ' ' + n, selected: on ? 'true' : 'false', bg: on ? t.text : t.chip, fg: on ? t.bg : t.text });
    const tab = (label, icon, href, on) => ({ label, icon, href, color: on ? t.accent : t.muted });
    return {
      t,
      docs,
      filters: [f('Alle', 26, true), f('Angebote', 7), f('Verträge', 3), f('Rechnungen', 4), f('Pläne', 12)],
      tabs: [
        tab('Übersicht', 'M3 11l9-7 9 7M5 10v10h14V10', 'IosHome.dc.html', false),
        tab('Zeitplan', 'M8 2v4M16 2v4M3 9h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z', 'IosZeitplan.dc.html', false),
        tab('Abnahmen', 'M9 3h6v4H9zM9 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3M9 14l2 2 4-4', 'IosAbnGewerke.dc.html', false),
        tab('Dokumente', 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z', 'IosDokumente.dc.html', true),
        tab('Profil', 'M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z', 'IosProfil.dc.html', false)
      ]
    };
  }
}
</script>
</body>
</html>
