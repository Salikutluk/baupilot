name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: k3s-runners
    # Self-hosted k3s runners (privileged dind): never run code from fork PRs on them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Script unit tests
        # Node 24 treats a directory argument as a module; with no argument it finds test/*.test.mjs itself.
        run: cd scripts && node --test
      - name: Token drift check
        run: scripts/gen-tokens --check
      - name: Hex literal lint
        run: scripts/lint-hex
      - name: Icon drift check
        run: scripts/gen-icons --check
      - name: Design freeze check
        run: scripts/design-freeze --check

  ios:
    runs-on: macos-15
    needs: scripts
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Install xcodegen
        run: brew install xcodegen
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create iPhone 15 simulator (iOS 26.2)
        # "|| true": the runner image may already ship this device; creating it again fails with "already exists".
        run: xcrun simctl create "iPhone 15" com.apple.CoreSimulator.SimDeviceType.iPhone-15 com.apple.CoreSimulator.SimRuntime.iOS-26-2 || true
      - name: Generate project and run tests
        env:
          # TEST_RUNNER_<VAR> reaches the test process as <VAR> (prefix stripped).
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/build/snapshots/ios
        run: |
          cd ios
          xcodegen generate
          xcodebuild test \
            -project Baupilot.xcodeproj \
            -scheme Baupilot \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -resultBundlePath "$RUNNER_TEMP/ios.xcresult"
      - name: Diff report
        if: always()
        # continue-on-error: diff-report exits 1 when a reference is missing; the test step is the gate,
        # and this step must never block the artifact uploads below.
        continue-on-error: true
        run: scripts/diff-report --platform ios
      - name: Diff report (gallery)
        if: always()
        # continue-on-error: same reason as the step above. Run from the repo root: diff-report resolves
        # relative directories against the cwd.
        continue-on-error: true
        run: |
          scripts/diff-report --platform ios \
            --actual-dir build/snapshots/ios-gallery \
            --reference-dir ios/BaupilotTests/Snapshots/Goldens \
            --out reports/ios-gallery
      - name: Upload diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-report-ios
          retention-days: 1  # copied to the k3s node by ios-artifacts below
          path: |
            reports/ios
            build/snapshots/ios
            reports/ios-gallery
            build/snapshots/ios-gallery
          if-no-files-found: warn
      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          retention-days: 1  # copied to the k3s node by ios-artifacts below
          path: ${{ runner.temp }}/ios.xcresult
          if-no-files-found: warn

  # The iOS job needs macOS, so it stays on GitHub's macos-15 runner; this copies its artifacts to the k3s node.
  ios-artifacts:
    runs-on: k3s-runners
    needs: ios
    if: always() && needs.ios.result != 'skipped'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ios-artifacts
      - name: Store artifacts on the k3s node
        run: |
          dest="/ci-artifacts/$GITHUB_RUN_ID/ios"
          sudo install -d -o "$(id -u)" "$dest"
          cp -r ios-artifacts/. "$dest/"
          echo "Stored in /var/lib/ci-artifacts-baupilot/$GITHUB_RUN_ID/ios on the k3s node"

  android:
    runs-on: k3s-runners
    needs: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The k3s runner image has no Android SDK (ubuntu-latest had one preinstalled).
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit and snapshot tests
        # The runner's ANDROID_HOME is used; no local.properties.
        # compileReleaseKotlin proves the release variant compiles without the debug-only gallery.
        run: cd android && ./gradlew --continue :app:testDebugUnitTest :app:compileReleaseKotlin
      - name: Diff report
        if: always()
        # continue-on-error: see the iOS job; the Gradle test step is the gate.
        continue-on-error: true
        run: scripts/diff-report --platform android
      - name: Diff report (gallery)
        if: always()
        continue-on-error: true
        run: |
          scripts/diff-report --platform android \
            --actual-dir build/snapshots/android-gallery \
            --reference-dir android/app/src/test/goldens \
            --out reports/android-gallery
      - name: Store artifacts on the k3s node
        if: always()
        # /ci-artifacts = hostPath /var/lib/ci-artifacts-baupilot on the node (infra/arc-runners-baupilot.yaml).
        # Runs older than 14 days are removed here.
        run: |
          sudo find /ci-artifacts -mindepth 1 -maxdepth 1 -mtime +14 -exec rm -rf {} +
          dest="/ci-artifacts/$GITHUB_RUN_ID/android"
          sudo install -d -o "$(id -u)" "$dest"
          for p in reports/android build/snapshots/android reports/android-gallery build/snapshots/android-gallery android/app/build/paparazzi/failures android/app/build/reports/tests; do
            [ -e "$p" ] && mkdir -p "$dest/$(dirname "$p")" && cp -r "$p" "$dest/$p"
          done
          echo "Stored in /var/lib/ci-artifacts-baupilot/$GITHUB_RUN_ID/android on the k3s node"
