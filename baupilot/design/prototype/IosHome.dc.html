<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot iOS – Übersicht</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, -apple-system, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 58px 20px 100px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">Einfamilienhaus · Musterweg 12</span>
        <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.6px">Übersicht</h1>
      </div>
      <a href="IosMitteilungen.dc.html" aria-label="Mitteilungen, 2 neu" style="width: 44px; height: 44px; border-radius: 22px; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; position: relative">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span style="position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 4px; background: {{t.accent}}"></span>
      </a>
    </div>

    <div style="background: {{t.surface}}; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">Aktuelle Phase</span>
        <span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">Phase 5 von 11</span>
      </div>
      <div style="font-size: 24px; font-weight: 700; letter-spacing: -0.4px">Fenster &amp; Türen</div>
      <div style="height: 8px; border-radius: 4px; background: {{t.track}}; overflow: hidden">
        <div style="width: 45%; height: 8px; border-radius: 4px; background: {{t.accent}}"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: {{t.muted}}">
        <span>Baubeginn März 2026</span>
        <span>Einzug geplant Sep 2027</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 20px; font-weight: 700">Als Nächstes benötigt</h2>
        <a href="IosZeitplan.dc.html" style="font-size: 15px; font-weight: 600; color: {{t.accent}}; text-decoration: none; min-height: 44px; margin: -12px 0; display: flex; align-items: center">Zeitplan</a>
      </div>
      <div style="background: {{t.surface}}; border-radius: 18px; overflow: hidden">
        <sc-for list="{{trades}}" as="g" hint-placeholder-count="3">
          <a href="IosGewerk.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-decoration: none; color: {{t.text}}; border-top: {{g.divider}}">
            <div style="width: 48px; height: 40px; border-radius: 12px; background: {{t.chip}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; white-space: nowrap; font-size: 12px; font-weight: 700; color: {{t.muted}}">{{g.kw}}</div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span style="font-size: 16px; font-weight: 600">{{g.name}}</span>
              <span style="font-size: 13px; color: {{t.muted}}">{{g.when}}</span>
            </div>
            <span style="font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 8px; background: {{g.badgeBg}}; color: {{g.badgeFg}}; white-space: nowrap">{{g.status}}</span>
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
          </a>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700">Dokumente</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{docs}}" as="d" hint-placeholder-count="4">
          <a href="IosDokumente.dc.html" style="background: {{t.surface}}; border-radius: 14px; padding: 0 14px; height: 52px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: {{t.text}}">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{d.icon}}"></path></svg>
            <div style="flex: 1; display: flex; justify-content: space-between; align-items: baseline">
              <span style="font-size: 15px; font-weight: 600">{{d.label}}</span>
              <span style="font-size: 15px; font-weight: 600; color: {{t.muted}}">{{d.count}}</span>
            </div>
          </a>
        </sc-for>
      </div>
    </div>
  </div>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 4px 0; background: {{t.bar}}; border-top: 1px solid {{t.border}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <sc-for list="{{tabs}}" as="b" hint-placeholder-count="5">
      <a href="{{b.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{b.color}}; font-size: 10px; font-weight: 600; min-height: 44px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.icon}}"></path></svg>
        {{b.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#121417', surface: '#1C1F23', text: '#F2F2F0', muted: '#A3A8AE', border: '#2A2E33', accent: '#FB923C', chip: '#262A2F', track: '#30353B', bar: '#17191CF2', aSoft: '#3A2414', aFg: '#FDBA74', iSoft: '#1A2740', iFg: '#93C5FD', oSoft: '#16301F', oFg: '#86EFAC' }
      : { bg: '#F5F4F1', surface: '#FFFFFF', text: '#17191C', muted: '#5C6168', border: '#E2E0DB', accent: '#C2410C', chip: '#F0EEEA', track: '#ECEAE5', bar: '#FFFFFFF2', aSoft: '#FDEBDD', aFg: '#9A3412', iSoft: '#E3EBFC', iFg: '#1E40AF', oSoft: '#E3F4E8', oFg: '#166534' };
    const line = '1px solid ' + t.border;
    const trades = [
      { name: 'Elektriker', kw: 'KW 3', when: 'Rohinstallation', status: 'Beauftragt', badgeBg: t.oSoft, badgeFg: t.oFg },
      { name: 'Installateur', kw: 'KW 5', when: '2 Angebote da', status: 'Vergleichen', badgeBg: t.iSoft, badgeFg: t.iFg },
      { name: 'Estrich', kw: 'KW 8', when: 'Angebote bis 15.01.', status: 'Anfragen', badgeBg: t.aSoft, badgeFg: t.aFg }
    ].map((g, i) => ({ ...g, divider: i ? line : '0' }));
    const tab = (label, icon, href, on) => ({ label, icon, href, color: on ? t.accent : t.muted });
    return {
      t,
      trades,
      docs: [
        { label: 'Angebote', count: '7', icon: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6' },
        { label: 'Verträge', count: '3', icon: 'M9 12l2 2 4-4M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z' },
        { label: 'Rechnungen', count: '4', icon: 'M4 2v20l3-2 3 2 3-2 3 2 3-2 1 1V2zM8 8h8M8 12h8M8 16h5' },
        { label: 'Pläne', count: '12', icon: 'M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15' }
      ],
      tabs: [
        tab('Übersicht', 'M3 11l9-7 9 7M5 10v10h14V10', 'IosHome.dc.html', true),
        tab('Zeitplan', 'M8 2v4M16 2v4M3 9h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z', 'IosZeitplan.dc.html', false),
        tab('Abnahmen', 'M9 3h6v4H9zM9 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3M9 14l2 2 4-4', 'IosAbnGewerke.dc.html', false),
        tab('Dokumente', 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z', 'IosDokumente.dc.html', false),
        tab('Profil', 'M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z', 'IosProfil.dc.html', false)
      ]
    };
  }
}
</script>
</body>
</html>
