<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot iOS – Protokoll Erdarbeiten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, -apple-system, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 50px 20px 24px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; height: 44px">
      <a href="IosAbnGewerke.dc.html" style="display: flex; align-items: center; gap: 2px; color: {{t.accent}}; text-decoration: none; font-size: 17px; min-height: 44px; margin-left: -6px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
        Abnahmen
      </a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.6px">Erdarbeiten</h1>
      <span style="font-size: 14px; color: {{t.muted}}">Tiefbau Schäfer · Baugrube &amp; Gründung</span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: {{t.oSoft}}; color: {{t.oFg}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1M22 4L12 14l-3-3"></path></svg>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 15px; font-weight: 700">Abgenommen am 14.04.2026</span>
        <span style="font-size: 13px">Unterschrieben · keine Mängel</span>
      </span>
      <a href="#" style="height: 36px; padding: 0 12px; border-radius: 10px; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: none">PDF</a>
    </div>

    <sc-for list="{{groups}}" as="grp" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: {{t.muted}}">{{grp.title}}</h2>
        <div style="background: {{t.surface}}; border-radius: 14px; overflow: hidden">
          <sc-for list="{{grp.rows}}" as="r" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 14px; border-top: {{r.divider}}">
              <span style="width: 20px; height: 20px; border-radius: 10px; background: {{t.ok}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
                <svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{t.okInk}}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
              </span>
              <span style="flex: 1; font-size: 14px">{{r.label}}</span>
              <span style="font-size: 12px; color: {{t.muted}}; white-space: nowrap">{{r.meta}}</span>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#121417', surface: '#1C1F23', text: '#F2F2F0', muted: '#A3A8AE', border: '#2A2E33', accent: '#FB923C', ok: '#4ADE80', okInk: '#0B1F12', oSoft: '#16301F', oFg: '#86EFAC' }
      : { bg: '#F5F4F1', surface: '#FFFFFF', text: '#17191C', muted: '#5C6168', border: '#E2E0DB', accent: '#C2410C', ok: '#15803D', okInk: '#FFFFFF', oSoft: '#E3F4E8', oFg: '#166534' };
    const line = '1px solid ' + t.border;
    const rows = (rs) => rs.map(([label, meta], i) => ({ label, meta, divider: i ? line : '0' }));
    return {
      t,
      groups: [
        { title: 'Absteckung', rows: rows([
          ['Schnurgerüst vom Vermesser', 'Protokoll'],
          ['Gebäudeecken & Höhe laut Lageplan', '2 Fotos']
        ]) },
        { title: 'Baugrube', rows: rows([
          ['Tiefe laut Plan', '3 Fotos'],
          ['Böschung bzw. Verbau standsicher', '2 Fotos'],
          ['Boden wie im Bodengutachten', 'Gutachten'],
          ['Kein stehendes Wasser', '1 Foto']
        ]) },
        { title: 'Leitungen & Verfüllung', rows: rows([
          ['Grundleitungen & Drainage fotografiert', '6 Fotos'],
          ['Verfüllung lagenweise verdichtet', 'Protokoll'],
          ['Mutterboden gesichert, Aushub abgefahren', '1 Foto']
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
