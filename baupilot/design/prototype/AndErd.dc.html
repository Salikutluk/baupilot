<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot Android – Protokoll Erdarbeiten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9C4300}a:hover{color:#753400}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <header style="height: 64px; margin-top: 32px; padding: 0 4px; display: flex; align-items: center; gap: 4px">
    <a href="AndAbnGewerke.dc.html" aria-label="Zurück" style="width: 48px; height: 48px; border-radius: 24px; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-size: 20px">Erdarbeiten</span>
      <span style="font-size: 13px; color: {{t.muted}}">Tiefbau Schäfer · Baugrube &amp; Gründung</span>
    </div>
  </header>

  <div style="margin: 8px 16px 0; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background: {{t.okBg}}; color: {{t.okFg}}">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1M22 4L12 14l-3-3"></path></svg>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 15px; font-weight: 500">Abgenommen am 14.04.2026</span>
      <span style="font-size: 13px">Unterschrieben · keine Mängel</span>
    </span>
    <a href="#" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{t.okFg}}; color: {{t.okFg}}; display: flex; align-items: center; font-size: 14px; font-weight: 500; text-decoration: none">PDF</a>
  </div>

  <sc-for list="{{groups}}" as="grp" hint-placeholder-count="3">
    <section>
      <h2 style="margin: 0; padding: 14px 16px 2px; font-size: 14px; font-weight: 500; color: {{t.primary}}">{{grp.title}}</h2>
      <sc-for list="{{grp.rows}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 16px; min-height: 48px; padding: 0 16px">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.ok}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1M22 4L12 14l-3-3"></path></svg>
          <span style="flex: 1; font-size: 15px">{{r.label}}</span>
          <span style="font-size: 13px; color: {{t.muted}}; white-space: nowrap">{{r.meta}}</span>
        </div>
      </sc-for>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#16130F', text: '#ECE0D8', muted: '#D7C3B8', primary: '#FFB68E', ok: '#7FD889', okBg: '#1F3A22', okFg: '#A6F0A6' }
      : { bg: '#FFF8F5', text: '#221A15', muted: '#52443C', primary: '#9C4300', ok: '#2E7D32', okBg: '#D7F5D3', okFg: '#14501C' };
    const rows = (rs) => rs.map(([label, meta]) => ({ label, meta }));
    return {
      t,
      groups: [
        { title: 'Absteckung', rows: rows([
          ['Schnurgerüst vom Vermesser', 'Protokoll'],
          ['Gebäudeecken & Höhe laut Lageplan', '2 Fotos']
        ]) },
        { title: 'Baugrube', rows: rows([
          ['Tiefe laut Plan', '3 Fotos'],
          ['Böschung bzw. Verbau standsicher', '2 Fotos'],
          ['Boden wie im Bodengutachten', 'Gutachten'],
          ['Kein stehendes Wasser', '1 Foto']
        ]) },
        { title: 'Leitungen & Verfüllung', rows: rows([
          ['Grundleitungen & Drainage fotografiert', '6 Fotos'],
          ['Verfüllung lagenweise verdichtet', 'Protokoll'],
          ['Mutterboden gesichert', '1 Foto']
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
