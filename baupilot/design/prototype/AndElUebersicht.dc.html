<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot Android – Abnahme Elektro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9C4300}a:hover{color:#753400}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <header style="height: 64px; margin-top: 32px; padding: 0 4px; display: flex; align-items: center; gap: 4px">
    <a href="AndAbnGewerke.dc.html" aria-label="Zurück" style="width: 48px; height: 48px; border-radius: 24px; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-size: 20px">Elektro</span>
      <span style="font-size: 13px; color: {{t.muted}}">Elektro Schmitt GmbH · 26.04.2027</span>
    </div>
  </header>

  <div style="padding: 8px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <div style="border-radius: 12px; border: 1px solid {{t.outlineVariant}}; padding: 12px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 500; color: {{t.muted}}">1 · Rohinstallation</span>
      <span style="font-size: 15px; font-weight: 500; color: {{t.okFg}}">Abgenommen 29.01.</span>
    </div>
    <div style="border-radius: 12px; background: {{t.primaryContainer}}; color: {{t.onPrimaryContainer}}; padding: 12px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 500">2 · Fertiginstallation</span>
      <span style="font-size: 15px; font-weight: 500">4 von 11 geprüft</span>
      <span style="display: block; height: 4px; border-radius: 2px; background: {{t.track}}"><span style="display: block; width: 36%; height: 4px; border-radius: 2px; background: {{t.primary}}"></span></span>
    </div>
  </div>

  <sc-for list="{{groups}}" as="grp" hint-placeholder-count="3">
    <section>
      <h2 style="margin: 0; padding: 14px 16px 2px; font-size: 14px; font-weight: 500; color: {{t.primary}}">{{grp.title}}</h2>
      <sc-for list="{{grp.rows}}" as="r" hint-placeholder-count="3">
        <a href="{{r.href}}" style="display: flex; align-items: center; gap: 16px; min-height: 60px; padding: 0 16px; text-decoration: none; color: {{t.text}}">
          <span style="width: 40px; height: 40px; border-radius: 20px; background: {{r.avBg}}; color: {{r.avFg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg>
          </span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px">{{r.name}}</span>
            <span style="font-size: 14px; color: {{t.muted}}">{{r.sub}}</span>
          </div>
          <span style="font-size: 13px; font-weight: 500; color: {{r.fg}}">{{r.status}}</span>
        </a>
      </sc-for>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#16130F', text: '#ECE0D8', muted: '#D7C3B8', outlineVariant: '#52443C', primary: '#FFB68E', primaryContainer: '#753400', onPrimaryContainer: '#FFDBCA', track: '#5A2800', okBg: '#1F3A22', okFg: '#A6F0A6', errBg: '#5C1B16', errFg: '#FFDAD6', err: '#FFB4AB', planBg: '#2E2823' }
      : { bg: '#FFF8F5', text: '#221A15', muted: '#52443C', outlineVariant: '#D7C3B8', primary: '#9C4300', primaryContainer: '#FFDBCA', onPrimaryContainer: '#331200', track: '#F5B892', okBg: '#D7F5D3', okFg: '#14501C', errBg: '#FFDAD6', errFg: '#410002', err: '#BA1A1A', planBg: '#F0E6E0' };
    const S = { ok: ['In Ordnung', t.okBg, t.okFg, t.okFg], run: ['Läuft', t.primaryContainer, t.onPrimaryContainer, t.primary], open: ['Offen', t.planBg, t.muted, t.muted], miss: ['Fehlt', t.errBg, t.errFg, t.err], have: ['Vorhanden', t.okBg, t.okFg, t.okFg] };
    const rows = (rs) => rs.map(([name, sub, k, icon, href]) => ({ name, sub, icon, href: href || '#', status: S[k][0], avBg: S[k][1], avFg: S[k][2], fg: S[k][3] }));
    const room = 'M3 11l9-7 9 7M5 10v10h14V10';
    const doc = 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6';
    return {
      t,
      groups: [
        { title: 'Haustechnik', rows: rows([
          ['Zählerschrank & FI-Test', '5 Prüfschritte', 'open', 'M5 3h14v18H5zM9 7h6M9 11h6M12 15v3', 'AndElVerteiler.dc.html'],
          ['Rauchwarnmelder', '3 von 5 getestet', 'run', 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 8v4M12 16h.01', 'AndElRauchmelder.dc.html']
        ]) },
        { title: 'Räume (9)', rows: rows([
          ['Küche', 'EG · Schritt 2 von 5', 'run', room, 'AndElRaum.dc.html'],
          ['Wohnen / Essen', 'EG · 14 Steckdosen, 4 Licht', 'ok', room],
          ['Bad', 'OG · 4 Steckdosen, 3 Auslässe', 'open', room]
        ]) },
        { title: 'Dokumente vom Elektriker', rows: rows([
          ['Prüfprotokoll VDE 0100-600', 'Pflicht vor Abnahme · anfordern', 'miss', doc],
          ['Verteilerplan & Stromkreisliste', 'PDF · 20.04.2027', 'have', doc]
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
