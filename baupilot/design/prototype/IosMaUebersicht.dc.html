<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot iOS – Abnahme Maler</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, -apple-system, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 50px 20px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; height: 44px">
      <a href="IosAbnGewerke.dc.html" style="display: flex; align-items: center; gap: 2px; color: {{t.accent}}; text-decoration: none; font-size: 17px; min-height: 44px; margin-left: -6px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
        Abnahmen
      </a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.6px">Maler</h1>
      <span style="font-size: 14px; color: {{t.muted}}">Malerbetrieb Hoffmann · Mo, 12.04.2027</span>
    </div>

    <div style="background: {{t.surface}}; border-radius: 14px; padding: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{facts}}" as="f" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 12px; font-weight: 600; color: {{t.muted}}">{{f.label}}</span>
          <span style="font-size: 16px; font-weight: 700">{{f.value}}</span>
        </div>
      </sc-for>
    </div>

    <sc-for list="{{groups}}" as="grp" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: {{t.muted}}">{{grp.title}}</h2>
        <div style="background: {{t.surface}}; border-radius: 14px; overflow: hidden">
          <sc-for list="{{grp.rows}}" as="r" hint-placeholder-count="4">
            <a href="{{r.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; text-decoration: none; color: {{t.text}}; border-top: {{r.divider}}">
              <span style="width: 14px; height: 14px; border-radius: 4px; background: {{r.swatch}}; border: 1px solid {{t.border}}; flex-shrink: 0"></span>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
                <span style="font-size: 15px; font-weight: 600">{{r.name}}</span>
                <span style="font-size: 13px; color: {{t.muted}}">{{r.sub}}</span>
              </div>
              <span style="font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 7px; background: {{r.bg}}; color: {{r.fg}}; white-space: nowrap">{{r.status}}</span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#121417', surface: '#1C1F23', text: '#F2F2F0', muted: '#A3A8AE', border: '#3A3F45', accent: '#FB923C', chip: '#262A2F', aSoft: '#3A2414', aFg: '#FDBA74', oSoft: '#16301F', oFg: '#86EFAC', eSoft: '#3B1717', eFg: '#FCA5A5' }
      : { bg: '#F5F4F1', surface: '#FFFFFF', text: '#17191C', muted: '#5C6168', border: '#D6D3CC', accent: '#C2410C', chip: '#F0EEEA', aSoft: '#FDEBDD', aFg: '#9A3412', oSoft: '#E3F4E8', oFg: '#166534', eSoft: '#FDE7E7', eFg: '#991B1B' };
    const line = '1px solid ' + t.border;
    const S = { ok: ['In Ordnung', t.oSoft, t.oFg], run: ['Läuft', t.aSoft, t.aFg], open: ['Offen', t.chip, t.muted], m: ['1 Mangel', t.eSoft, t.eFg] };
    const C = { weiss: '#F7F6F2', sand: '#E6DCC8', salbei: '#B9C4B0' };
    const rows = (rs) => rs.map(([name, sub, col, k, href], i) => ({ name, sub, swatch: C[col], href: href || '#', status: S[k][0], bg: S[k][1], fg: S[k][2], divider: i ? line : '0' }));
    return {
      t,
      facts: [
        { label: 'Qualität', value: 'Q3' },
        { label: 'Farbtöne', value: '3 bemustert' },
        { label: 'Räume', value: '3 von 9' }
      ],
      groups: [
        { title: 'Erdgeschoss', rows: rows([
          ['Wohnen / Essen', 'Sand · Decke Weiß · Schritt 2 von 5', 'sand', 'run', 'IosMaRaum.dc.html'],
          ['Küche', 'Weiß, Latex abwaschbar', 'weiss', 'ok'],
          ['Flur & Treppenhaus', 'Weiß', 'weiss', 'm']
        ]) },
        { title: 'Obergeschoss', rows: rows([
          ['Schlafen', 'Salbei, Akzentwand', 'salbei', 'ok'],
          ['Kind 1 & Kind 2', 'Weiß', 'weiss', 'open'],
          ['Bad OG', 'Weiß, feuchtraumgeeignet', 'weiss', 'open']
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
