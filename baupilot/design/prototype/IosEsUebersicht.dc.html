<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot iOS – Abnahme Estrich</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, -apple-system, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 50px 20px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; height: 44px">
      <a href="IosAbnGewerke.dc.html" style="display: flex; align-items: center; gap: 2px; color: {{t.accent}}; text-decoration: none; font-size: 17px; min-height: 44px; margin-left: -6px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
        Abnahmen
      </a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.6px">Estrich</h1>
      <span style="font-size: 14px; color: {{t.muted}}">Estrichbau Wagner · Mo, 22.02.2027</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="background: {{t.surface}}; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; border: 2px solid {{t.accent}}">
        <span style="font-size: 12px; font-weight: 600; color: {{t.muted}}">1 · Nach dem Einbau</span>
        <span style="font-size: 15px; font-weight: 600">3 von 4 geprüft</span>
        <span style="height: 4px; border-radius: 2px; background: {{t.track}}; display: block"><span style="display: block; width: 75%; height: 4px; border-radius: 2px; background: {{t.accent}}"></span></span>
      </div>
      <div style="background: {{t.surface}}; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; font-weight: 600; color: {{t.muted}}">2 · Belegreife</span>
        <span style="font-size: 15px; font-weight: 600; color: {{t.muted}}">Aufheizen ab 01.03.</span>
      </div>
    </div>

    <sc-for list="{{groups}}" as="grp" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: {{t.muted}}">{{grp.title}}</h2>
        <div style="background: {{t.surface}}; border-radius: 14px; overflow: hidden">
          <sc-for list="{{grp.rows}}" as="r" hint-placeholder-count="3">
            <a href="{{r.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; text-decoration: none; color: {{t.text}}; border-top: {{r.divider}}">
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
                <span style="font-size: 15px; font-weight: 600">{{r.name}}</span>
                <span style="font-size: 13px; color: {{t.muted}}">{{r.sub}}</span>
              </div>
              <span style="font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 7px; background: {{r.bg}}; color: {{r.fg}}; white-space: nowrap">{{r.status}}</span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: {{t.wSoft}}; color: {{t.wFg}}">
      <svg aria-hidden="true" style="flex-shrink: 0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
      <span style="font-size: 13px; line-height: 1.4">Ohne CM-Messung und Aufheizprotokoll keinen Boden verlegen lassen.</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#121417', surface: '#1C1F23', text: '#F2F2F0', muted: '#A3A8AE', border: '#2A2E33', accent: '#FB923C', chip: '#262A2F', track: '#3A3F45', aSoft: '#3A2414', aFg: '#FDBA74', oSoft: '#16301F', oFg: '#86EFAC', eSoft: '#3B1717', eFg: '#FCA5A5', wSoft: '#3A2E0E', wFg: '#FCD34D' }
      : { bg: '#F5F4F1', surface: '#FFFFFF', text: '#17191C', muted: '#5C6168', border: '#E2E0DB', accent: '#C2410C', chip: '#F0EEEA', track: '#E4E1DB', aSoft: '#FDEBDD', aFg: '#9A3412', oSoft: '#E3F4E8', oFg: '#166534', eSoft: '#FDE7E7', eFg: '#991B1B', wSoft: '#FEF3C7', wFg: '#78350F' };
    const line = '1px solid ' + t.border;
    const S = { ok: ['In Ordnung', t.oSoft, t.oFg], run: ['Läuft', t.aSoft, t.aFg], open: ['Offen', t.chip, t.muted], plan: ['Geplant', t.chip, t.muted], m: ['1 Mangel', t.eSoft, t.eFg], must: ['Pflicht', t.eSoft, t.eFg] };
    const rows = (rs) => rs.map(([name, sub, k, href], i) => ({ name, sub, href: href || '#', status: S[k][0], bg: S[k][1], fg: S[k][2], divider: i ? line : '0' }));
    return {
      t,
      groups: [
        { title: 'Direkt nach dem Einbau', rows: rows([
          ['Höhe zum Meterriss', '7 Räume · alle auf Sollhöhe', 'ok'],
          ['Randdämmstreifen', 'An allen Wänden & Pfosten', 'ok'],
          ['Ebenheit', '2-m-Richtlatte · 4 von 7 Räumen', 'm', 'IosEsEbenheit.dc.html'],
          ['Risse & Hohlstellen', 'Abklopfen, Ränder ansehen', 'open']
        ]) },
        { title: 'Trocknung & Belegreife', rows: rows([
          ['Aufheizprotokoll', 'Fußbodenheizung · ab 01.03.', 'open', 'IosEsBelegreife.dc.html'],
          ['CM-Messung', 'Durch den Bodenleger · vor Verlegung', 'must', 'IosEsBelegreife.dc.html']
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
