<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot Android – Abnahme Fliesen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9C4300}a:hover{color:#753400}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <header style="height: 64px; margin-top: 32px; padding: 0 4px; display: flex; align-items: center; gap: 4px">
    <a href="AndAbnGewerke.dc.html" aria-label="Zurück" style="width: 48px; height: 48px; border-radius: 24px; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-size: 20px">Fliesen</span>
      <span style="font-size: 13px; color: {{t.muted}}">Fliesen Krause · 22.03.2027</span>
    </div>
  </header>

  <div style="padding: 8px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <div style="border-radius: 12px; border: 1px solid {{t.outlineVariant}}; padding: 12px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 500; color: {{t.muted}}">1 · Abdichtung</span>
      <span style="font-size: 15px; font-weight: 500; color: {{t.okFg}}">Abgenommen 15.03.</span>
    </div>
    <div style="border-radius: 12px; background: {{t.primaryContainer}}; color: {{t.onPrimaryContainer}}; padding: 12px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 500">2 · Fliesen fertig</span>
      <span style="font-size: 15px; font-weight: 500">2 von 4 Räumen</span>
      <span style="display: block; height: 4px; border-radius: 2px; background: {{t.track}}"><span style="display: block; width: 50%; height: 4px; border-radius: 2px; background: {{t.primary}}"></span></span>
    </div>
  </div>

  <sc-for list="{{groups}}" as="grp" hint-placeholder-count="3">
    <section>
      <h2 style="margin: 0; padding: 14px 16px 2px; font-size: 14px; font-weight: 500; color: {{t.primary}}">{{grp.title}}</h2>
      <sc-for list="{{grp.rows}}" as="r" hint-placeholder-count="3">
        <a href="{{r.href}}" style="display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 0 16px; text-decoration: none; color: {{t.text}}">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px">{{r.name}}</span>
            <span style="font-size: 14px; color: {{t.muted}}">{{r.sub}}</span>
          </div>
          <span style="height: 28px; box-sizing: border-box; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; font-size: 12px; font-weight: 500; background: {{r.bg}}; color: {{r.fg}}; white-space: nowrap">{{r.status}}</span>
        </a>
      </sc-for>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#16130F', text: '#ECE0D8', muted: '#D7C3B8', outlineVariant: '#52443C', primary: '#FFB68E', primaryContainer: '#753400', onPrimaryContainer: '#FFDBCA', track: '#5A2800', okBg: '#1F3A22', okFg: '#A6F0A6', planBg: '#2E2823' }
      : { bg: '#FFF8F5', text: '#221A15', muted: '#52443C', outlineVariant: '#D7C3B8', primary: '#9C4300', primaryContainer: '#FFDBCA', onPrimaryContainer: '#331200', track: '#F5B892', okBg: '#D7F5D3', okFg: '#14501C', planBg: '#F0E6E0' };
    const S = { ok: ['In Ordnung', t.okBg, t.okFg], run: ['Läuft', t.primaryContainer, t.onPrimaryContainer], open: ['Offen', t.planBg, t.muted] };
    const rows = (rs) => rs.map(([name, sub, k, href]) => ({ name, sub, href: href || '#', status: S[k][0], bg: S[k][1], fg: S[k][2] }));
    return {
      t,
      groups: [
        { title: 'Abdichtung – vor dem Fliesen', rows: rows([
          ['Dusche bodengleich', 'Dichtband in Ecken & am Ablauf', 'ok'],
          ['Wandflächen Bad', 'Spritzwasserbereich Wanne', 'ok']
        ]) },
        { title: 'Räume', rows: rows([
          ['Bad OG', 'Boden & Wand · Schritt 3 von 6', 'run', 'AndFlBad.dc.html'],
          ['Gäste-WC', 'Boden & Wand', 'ok'],
          ['Küche', 'Fliesenspiegel', 'ok'],
          ['Flur & Diele', 'Boden 32 m²', 'open']
        ]) },
        { title: 'Übergabe', rows: rows([
          ['Ersatzfliesen', '1 Karton je Sorte, Charge notiert', 'open']
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
