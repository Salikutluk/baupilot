<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Baupilot iOS – Zeitplan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, -apple-system, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 58px 20px 100px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">Einzug geplant September 2027</span>
      <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.6px">Zeitplan</h1>
    </div>

    <div style="background: {{t.surface}}; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: {{t.aFg}}">Jetzt Handwerker anfragen</span>
      <sc-for list="{{asks}}" as="a" hint-placeholder-count="2">
        <a href="{{a.href}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; color: {{t.text}}">
          <span style="width: 10px; height: 10px; transform: rotate(45deg); background: {{t.accent}}; flex-shrink: 0"></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 15px; font-weight: 600">{{a.name}}</span>
            <span style="font-size: 13px; color: {{t.muted}}">{{a.sub}}</span>
          </span>
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </sc-for>
    </div>

    <div style="display: flex; gap: 14px; font-size: 12px; color: {{t.muted}}">
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.done}}"></span>Erledigt</span>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.accent}}"></span>Läuft</span>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.plan}}"></span>Geplant</span>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; transform: rotate(45deg); background: {{t.accent}}"></span>Anfragen</span>
    </div>

    <div role="img" aria-label="Zeitplan aller Gewerke von März 2026 bis September 2027, heute Mitte Dezember 2026" style="display: flex; flex-direction: column">
      <div style="display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 8px; height: 20px">
        <span></span>
        <div style="position: relative">
          <sc-for list="{{months}}" as="m" hint-placeholder-count="5">
            <span style="position: absolute; left: {{m.left}}%; font-size: 11px; font-weight: 600; color: {{t.muted}}; white-space: nowrap">{{m.label}}</span>
          </sc-for>
        </div>
      </div>
      <div style="position: relative">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="11">
          <div style="display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 8px; align-items: center; height: 33px; border-top: 1px solid {{t.border}}">
            <span style="font-size: 13px; font-weight: {{r.weight}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
            <div style="position: relative; height: 33px">
              <span style="position: absolute; top: 11px; left: {{r.left}}%; width: {{r.width}}%; min-width: 10px; height: 12px; border-radius: 4px; background: {{r.color}}"></span>
              <sc-if value="{{r.ask}}" hint-placeholder-val="{{ false }}">
                <span style="position: absolute; top: 13px; left: calc({{r.askLeft}}% - 4px); width: 8px; height: 8px; transform: rotate(45deg); background: {{t.accent}}; outline: 2px solid {{t.bg}}"></span>
              </sc-if>
            </div>
          </div>
        </sc-for>
        <div style="position: absolute; top: 0; bottom: 0; left: calc(126px + (100% - 126px) * {{todayFrac}}); width: 2px; background: {{t.text}}"></div>
      </div>
      <div style="display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 8px; padding-top: 4px">
        <span></span>
        <span style="padding-left: calc({{todayPct}}% - 14px); font-size: 11px; font-weight: 700">Heute</span>
      </div>
    </div>
  </div>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 4px 0; background: {{t.bar}}; border-top: 1px solid {{t.border}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <sc-for list="{{tabs}}" as="b" hint-placeholder-count="5">
      <a href="{{b.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{b.color}}; font-size: 10px; font-weight: 600; min-height: 44px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.icon}}"></path></svg>
        {{b.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? false;
    const t = d
      ? { bg: '#121417', surface: '#1C1F23', text: '#F2F2F0', muted: '#A3A8AE', border: '#2A2E33', accent: '#FB923C', aFg: '#FDBA74', done: '#22A355', plan: '#5A6068', bar: '#17191CF2' }
      : { bg: '#F5F4F1', surface: '#FFFFFF', text: '#17191C', muted: '#5C6168', border: '#E2E0DB', accent: '#C2410C', aFg: '#9A3412', done: '#15803D', plan: '#B9B5AC', bar: '#FFFFFFF2' };
    const SPAN = 19; // Monate ab März 2026
    const today = 9.6; // Mitte Dezember 2026
    const pct = (m) => (m / SPAN * 100).toFixed(2);
    const raw = [
      ['Erdarbeiten', 0, 1.5], ['Rohbau', 1.5, 8], ['Zimmerer', 8, 8.9], ['Dachdecker', 8.8, 9.5], ['Fenster & Türen', 9.4, 10],
      ['Elektro', 10.1, 12], ['Sanitär & Heizung', 10.6, 12.2], ['Estrich', 11.6, 13], ['Fliesen', 12.6, 14], ['Maler', 13.4, 15], ['Außenanlagen', 15.5, 18]
    ];
    const rows = raw.map(([name, a, b]) => {
      const state = b <= today ? 'done' : a <= today ? 'run' : 'plan';
      const askAt = a - 2;
      const ask = state === 'plan' && askAt >= today - 0.5 && askAt < today + 2;
      return {
        name, left: pct(a), width: pct(b - a),
        color: state === 'done' ? t.done : state === 'run' ? t.accent : t.plan,
        weight: state === 'run' ? '700' : '500',
        ask, askLeft: pct(Math.max(askAt, 0))
      };
    });
    const tab = (label, icon, href, on) => ({ label, icon, href, color: on ? t.accent : t.muted });
    return {
      t,
      rows,
      todayFrac: (today / SPAN).toFixed(4),
      todayPct: pct(today),
      months: [[0, 'Mär 26'], [4, 'Jul'], [8, 'Nov'], [12, 'Mär 27'], [16, 'Jul']].map(([m, label]) => ({ left: pct(m), label })),
      asks: [
        { name: 'Estrich', sub: 'Start KW 8 · Angebote bis 15.01.', href: 'IosGewerk.dc.html' },
        { name: 'Fliesen & Maler', sub: 'Start März · jetzt je 3 Angebote einholen', href: '#' }
      ],
      tabs: [
        tab('Übersicht', 'M3 11l9-7 9 7M5 10v10h14V10', 'IosHome.dc.html', false),
        tab('Zeitplan', 'M8 2v4M16 2v4M3 9h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z', 'IosZeitplan.dc.html', true),
        tab('Abnahmen', 'M9 3h6v4H9zM9 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3M9 14l2 2 4-4', 'IosAbnGewerke.dc.html', false),
        tab('Dokumente', 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z', 'IosDokumente.dc.html', false),
        tab('Profil', 'M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z', 'IosProfil.dc.html', false)
      ]
    };
  }
}
</script>
</body>
</html>
