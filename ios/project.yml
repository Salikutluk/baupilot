name: Baupilot
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.19.7
targets:
  Baupilot:
    type: application
    platform: iOS
    sources:
      - path: Baupilot
        excludes:
          - Resources/Fonts/OFL.txt
      - path: ../fixtures/baupilot.json
        buildPhase: resources
    info:
      path: build/Info.plist
      properties:
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.baupilot.app
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  BaupilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BaupilotTests
        excludes:
          - "Snapshots/Goldens/**"
    dependencies:
      - target: Baupilot
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.baupilot.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Baupilot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Baupilot"
        BUNDLE_LOADER: "$(TEST_HOST)"
  BaupilotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BaupilotUITests
    dependencies:
      - target: Baupilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.baupilot.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Baupilot
schemes:
  Baupilot:
    build:
      targets:
        Baupilot: all
    test:
      targets:
        - BaupilotTests
        - BaupilotUITests
